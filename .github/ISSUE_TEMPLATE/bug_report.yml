name: Bug report
description: Report a problem in Rufin
title: "[Bug]: "
body:
  - type: checkboxes
    id: duplicate-check
    attributes:
      label: Duplicate check
      options:
        - label: I have already searched through open/closed issues
          required: true

  - type: dropdown
    id: rufin-version
    attributes:
      label: Rufin version
      description: You can check which version you are running from Main Menu/About Rufin
      options:
        - 0.7.8 (latest)
        - 0.7.7
        - 0.7.6
        - 0.7.5
        - 0.7.4
        - 0.7.3
      default: 0
    validations:
      required: true

  - type: dropdown
    id: server
    attributes:
      label: Server
      options:
        - Jellyfin
        - Navidrome
        - OpenSubsonic
        - Local
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How did you install Rufin?
      options:
        - Flatpak
        - AUR
        - Nix
        - Local build
        - Other
    validations:
      required: true

  - type: dropdown
    id: desktop
    attributes:
      label: Desktop environment/WM
      options:
        - niri
        - GNOME
        - KDE Plasma
        - Hyprland
        - i3
        - Sway
        - Qtile
        - Other
    validations:
      required: false

  - type: textarea
    id: additional-information
    attributes:
      label: Additional information
      description: Please provide additional information if bug is server related and your music server is not up-to-date, or to add context that may be useful to know
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Please describe the problem and what you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps needed to reproduce the problem.
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
