name: Nix

on:
  release:
    types:
      - published
  push:
    branches:
      - main
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      upload_cache:
        required: false
        default: false
        type: boolean
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: nix-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  CACHIX_CACHE_NAME: rufin

jobs:
  build:
    name: Build flake
    runs-on: ubuntu-latest

    steps:
      - name: Validate manual build ref
        if: github.event_name == 'workflow_dispatch'
        env:
          BUILD_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          ref="$BUILD_REF"

          if [[ "$ref" == "main" || "$ref" == "refs/heads/main" ]]; then
            exit 0
          fi

          tag="${ref#refs/tags/}"
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            exit 0
          fi

          echo "Nix cache builds are limited to main or version tags" >&2
          exit 1

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify signed release tag
        if: github.event_name == 'release' || startsWith(inputs.ref, 'v') || startsWith(inputs.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref }}
        run: cargo run --locked -p xtask -- verify release-tag "$RELEASE_TAG"

      - name: Validate release metadata
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          metainfo_version="$(
            sed -n 's/.*<release version="\([^"]*\)".*/\1/p' data/io.github.screwys.Rufin.metainfo.xml |
              head -n 1
          )"

          test "$version" = "$cargo_version"
          test "$version" = "$metainfo_version"

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            connect-timeout = 10
            download-attempts = 5
            extra-substituters = https://rufin.cachix.org
            extra-trusted-public-keys = rufin.cachix.org-1:7+XHqna/b9jZpCorYvZIoE0UjLju4IKbXlJGt35+SNc=
            max-substitution-jobs = 4
            stalled-download-timeout = 90

      - name: Configure Cachix
        if: github.event_name != 'pull_request' || inputs.upload_cache
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check flake
        run: bash scripts/retry-nix nix flake check --no-write-lock-file --print-build-logs

      - name: Build app
        id: build
        run: |
          set -euo pipefail
          store_path="$(bash scripts/retry-nix nix build .#rufin --no-link --print-out-paths --print-build-logs)"
          echo "store-path=$store_path" >> "$GITHUB_OUTPUT"

      - name: Verify package layout
        env:
          STORE_PATH: ${{ steps.build.outputs.store-path }}
        run: cargo run --locked -p xtask -- verify package-layout "$STORE_PATH" /

      - name: Create media verification files
        run: |
          bash scripts/retry-nix nix develop --command \
            bash scripts/create-media-verification-files "$RUNNER_TEMP/rufin-package-media"

      - name: Verify wrapped app
        env:
          STORE_PATH: ${{ steps.build.outputs.store-path }}
        run: |
          for media in "$RUNNER_TEMP"/rufin-package-media/*; do
            "$STORE_PATH/bin/rufin" --verify-media "$media"
          done
