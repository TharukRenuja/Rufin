name: Nix

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

env:
  CACHIX_CACHE_NAME: screwys-rufin

jobs:
  build:
    name: Build flake
    runs-on: ubuntu-latest

    steps:
      - name: Validate cached build ref
        env:
          BUILD_REF: ${{ inputs.ref }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'push' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            ref="$RELEASE_TAG"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            ref="$RELEASE_TAG"
          else
            ref="$BUILD_REF"
          fi

          if [[ "$ref" == "main" || "$ref" == "refs/heads/main" ]]; then
            exit 0
          fi

          tag="${ref#refs/tags/}"
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            exit 0
          fi

          echo "Nix cache builds are limited to main or version tags" >&2
          exit 1

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'push' && github.ref_name || inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify signed release tag
        if: github.event_name == 'release' || github.event_name == 'push' || startsWith(inputs.ref, 'v') || startsWith(inputs.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'push' && github.ref_name || inputs.ref }}
        run: cargo run --locked -p xtask -- verify release-tag "$RELEASE_TAG"

      - name: Validate release metadata
        if: github.event_name == 'release' || github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          metainfo_version="$(
            sed -n 's/.*<release version="\([^"]*\)".*/\1/p' data/io.github.screwys.Rufin.metainfo.xml |
              head -n 1
          )"

          test "$version" = "$cargo_version"
          test "$version" = "$metainfo_version"

      - name: Install runtime check tooling
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y dbus-x11 xvfb

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            connect-timeout = 10
            download-attempts = 5
            max-substitution-jobs = 4
            stalled-download-timeout = 90

      - name: Configure Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check flake
        run: bash scripts/retry-nix.sh nix flake check --print-build-logs

      - name: Build app
        run: bash scripts/retry-nix.sh nix build .#rufin --print-build-logs

      - name: Verify package layout
        run: cargo run --locked -p xtask -- verify package-layout result /

      - name: Verify wrapped app
        run: timeout 30s xvfb-run -a dbus-run-session -- bash scripts/retry-nix.sh nix run .# -- --startup-check
