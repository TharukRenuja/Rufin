name: Dependency Artifacts

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - Cargo.lock
      - Cargo.toml
      - crates/**/Cargo.toml
      - flake.nix
      - packaging/flatpak/cargo-sources.json
      - packaging/flatpak/update-cargo-sources.sh
      - .github/scripts/update-nix-cargo-hash.sh
      - .github/workflows/dependency-artifacts.yml

permissions:
  contents: read

concurrency:
  group: dependency-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix-cargo-hash:
    name: Check Nix cargo hash
    runs-on: ubuntu-latest

    steps:
      - name: Check out pull request branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            connect-timeout = 10
            download-attempts = 5
            extra-substituters = https://screwys-rufin.cachix.org
            extra-trusted-public-keys = screwys-rufin.cachix.org-1:BOMRVJbl30p0hFwsumnUXNjf88hLOysCSAhNpLhljqA=
            max-substitution-jobs = 4
            stalled-download-timeout = 90

      - name: Check Nix cargo hash
        run: bash .github/scripts/update-nix-cargo-hash.sh --check

  refresh:
    name: Refresh dependency artifacts
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'renovate/')
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.artifacts.outputs.changed }}

    steps:
      - name: Check out pull request branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Refresh Flatpak cargo sources
        run: bash packaging/flatpak/update-cargo-sources.sh

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            connect-timeout = 10
            download-attempts = 5
            extra-substituters = https://screwys-rufin.cachix.org
            extra-trusted-public-keys = screwys-rufin.cachix.org-1:BOMRVJbl30p0hFwsumnUXNjf88hLOysCSAhNpLhljqA=
            max-substitution-jobs = 4
            stalled-download-timeout = 90

      - name: Refresh Nix cargo hash
        run: bash .github/scripts/update-nix-cargo-hash.sh

      - name: Detect artifact changes
        id: artifacts
        run: |
          set -euo pipefail

          if git diff --quiet -- packaging/flatpak/cargo-sources.json flake.nix; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff --name-only -- packaging/flatpak/cargo-sources.json flake.nix

      - name: Upload refreshed artifacts
        if: steps.artifacts.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-artifacts
          path: |
            packaging/flatpak/cargo-sources.json
            flake.nix
          if-no-files-found: error
          retention-days: 1

  commit:
    name: Commit dependency artifacts
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out pull request branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Download refreshed artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dependency-artifacts
          path: .

      - name: Validate refreshed artifact paths
        run: |
          set -euo pipefail

          changed_files="$(
            git status --porcelain --untracked-files=no |
              sed 's/^...//'
          )"
          if [[ -z "$changed_files" ]]; then
            echo "Downloaded artifact did not change any tracked files" >&2
            exit 1
          fi

          unexpected="$(
            printf '%s\n' "$changed_files" |
              grep -Ev '^(packaging/flatpak/cargo-sources\.json|flake\.nix)$' || true
          )"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected refreshed artifact path(s):" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Resolve GitHub App bot author
        id: app-author
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          echo "git-name=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "git-email=${user_id}+${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Commit refreshed artifacts
        env:
          GIT_EMAIL: ${{ steps.app-author.outputs.git-email }}
          GIT_NAME: ${{ steps.app-author.outputs.git-name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          git config user.name "$GIT_NAME"
          git config user.email "$GIT_EMAIL"
          git add packaging/flatpak/cargo-sources.json flake.nix
          git commit --no-verify -m "chore(deps): refresh generated dependency artifacts"
          git push "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git" "HEAD:${HEAD_BRANCH}"
