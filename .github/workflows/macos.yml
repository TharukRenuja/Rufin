name: macOS

on:
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build, including a test commit for an existing release
        required: true
        default: main
      upload_release_tag:
        description: Optional existing GitHub release tag to upload the disk image to
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: macos-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.upload_release_tag || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Check macOS paths
    runs-on: ubuntu-latest
    outputs:
      build_required: ${{ steps.classify.outputs.build_required }}

    steps:
      - name: Check out pull request
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          build_required=true
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            build_required=false
            while IFS= read -r path; do
              case "$path" in
                .cargo/*|.github/workflows/macos.yml|Cargo.lock|Cargo.toml|crates/*|data/*|justfile|packaging/macos/*|scripts/create-media-verification-files)
                  build_required=true
                  break
                  ;;
              esac
            done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          fi
          echo "build_required=$build_required" >> "$GITHUB_OUTPUT"

  build:
    name: Build macOS ${{ matrix.architecture }} disk image
    needs: changes
    if: needs.changes.outputs.build_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_AUTO_UPDATE: 1

    steps:
      - name: Validate release target
        if: github.event_name == 'release' || inputs.upload_release_tag != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.upload_release_tag }}
        run: |
          set -euo pipefail
          release_tag="$RELEASE_TAG"
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && inputs.ref || github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify signed release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: cargo run --locked -p xtask -- verify release-tag "$RELEASE_TAG"

      - name: Validate release metadata
        if: github.event_name == 'release' || inputs.upload_release_tag != ''
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.upload_release_tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          metainfo_version="$(
            sed -n 's/.*<release version="\([^"]*\)".*/\1/p' data/io.github.screwys.Rufin.metainfo.xml |
              head -n 1
          )"

          test "$version" = "$cargo_version"
          test "$version" = "$metainfo_version"

      - name: Install packaging dependencies
        run: |
          brew install \
            adwaita-icon-theme \
            dylibbundler \
            gettext \
            gstreamer \
            gtk4 \
            libadwaita \
            librsvg \
            pkgconf \
            shared-mime-info \
            wavpack
          brew install --cask gstreamer-runtime

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          xcode_app="$(
            find /Applications -maxdepth 1 -type d -name 'Xcode_26.*.app' -print |
              sort -V |
              tail -n 1
          )"
          test -n "$xcode_app"
          developer_dir="$xcode_app/Contents/Developer"
          test -d "$developer_dir"
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          sdk_version="$(DEVELOPER_DIR="$developer_dir" xcrun --sdk macosx --show-sdk-version)"
          [[ "$sdk_version" == 26.* ]]
          echo "Using $xcode_app with macOS SDK $sdk_version."

      - name: Test platform integrations
        run: |
          set -euo pipefail
          cargo test --locked -p secrets
          cargo test --locked -p desktop-integration
          cargo test --locked -p sources metadata_
          cargo test --locked -p rufin settings_

      - name: Build macOS disk image
        run: |
          set -euo pipefail
          gettext_prefix="$(brew --prefix gettext)"
          export PATH="${gettext_prefix}/bin:$PATH"
          RUFIN_ARTIFACT_ROOT="$PWD/dist" \
            RUFIN_DMG_ARTIFACT="$PWD/dist/Rufin-macos-${{ matrix.architecture }}.dmg" \
            packaging/macos/build

      - name: Verify disk image
        run: |
          set -euo pipefail
          media_dir="$RUNNER_TEMP/rufin-package-media"
          mount_dir="$RUNNER_TEMP/rufin-dmg"
          dmg_path="dist/Rufin-macos-${{ matrix.architecture }}.dmg"
          scripts/create-media-verification-files "$media_dir"
          mkdir -p "$mount_dir"
          hdiutil verify "$dmg_path"
          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_dir"
          trap 'hdiutil detach "$mount_dir"' EXIT
          for media in "$media_dir"/*; do
            RUFIN_GST_REGISTRY_1_0="$RUNNER_TEMP/rufin-gstreamer-registry.bin" \
              "$mount_dir/Rufin.app/Contents/MacOS/rufin" --verify-media "$media"
          done
          hdiutil detach "$mount_dir"
          trap - EXIT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Rufin-macos-${{ matrix.architecture }}.dmg
          path: dist/Rufin-macos-${{ matrix.architecture }}.dmg
          if-no-files-found: error
          retention-days: 7

  required:
    name: macOS required
    needs:
      - changes
      - build
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Enforce macOS build policy
        env:
          BUILD_REQUIRED: ${{ needs.changes.outputs.build_required }}
          BUILD_RESULT: ${{ needs.build.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: |
          set -euo pipefail
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "macOS path classification failed: $CHANGES_RESULT" >&2
            exit 1
          fi
          if [[ "$BUILD_REQUIRED" != "true" ]]; then
            echo "The macOS build is not required for these changes."
            exit 0
          fi
          if [[ "$BUILD_RESULT" != "success" ]]; then
            echo "The macOS build did not pass: $BUILD_RESULT" >&2
            exit 1
          fi
          echo "The macOS build passed."

  release:
    name: Upload macOS release asset
    if: github.event_name == 'release' || inputs.upload_release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download workflow artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: Rufin-macos-*.dmg
          path: dist
          merge-multiple: true

      - name: Generate checksum
        run: |
          set -euo pipefail
          for disk_image in dist/Rufin-macos-*.dmg; do
            sha256sum "$disk_image" > "$disk_image.sha256"
          done

      - name: Attest macOS disk image
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/Rufin-macos-*.dmg

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.upload_release_tag }}
        run: gh release upload "$RELEASE_TAG" dist/Rufin-macos-*.dmg dist/Rufin-macos-*.dmg.sha256 --clobber --repo "$GITHUB_REPOSITORY"
