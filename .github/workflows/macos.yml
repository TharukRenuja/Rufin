name: macOS

on:
  pull_request:
    paths:
      - .github/workflows/macos.yml
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - data/**
      - justfile
      - packaging/macos/**
      - scripts/build-dmg
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: main
      upload_release_tag:
        description: Optional existing GitHub release tag to upload the disk image to
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: macos-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.upload_release_tag || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS disk image
    runs-on: macos-latest
    env:
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_AUTO_UPDATE: 1

    steps:
      - name: Validate release target
        if: github.event_name == 'release' || inputs.upload_release_tag != ''
        shell: bash
        env:
          BUILD_REF: ${{ inputs.ref }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.upload_release_tag }}
        run: |
          set -euo pipefail
          release_tag="$RELEASE_TAG"
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            build_ref="$BUILD_REF"
            if [[ "$build_ref" != "$release_tag" && "$build_ref" != "refs/tags/$release_tag" ]]; then
              echo "Manual release uploads must build the same tag they upload" >&2
              exit 1
            fi
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && inputs.ref || github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install packaging dependencies
        run: |
          brew install \
            adwaita-icon-theme \
            dylibbundler \
            gettext \
            gstreamer \
            libadwaita \
            pkgconf \
            shared-mime-info

      - name: Build macOS disk image
        run: |
          set -euo pipefail
          gettext_prefix="$(brew --prefix gettext)"
          export PATH="${gettext_prefix}/bin:$PATH"
          RUFIN_ARTIFACT_ROOT="$PWD/dist" scripts/build-dmg
          hdiutil verify dist/Rufin.dmg

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Rufin.dmg
          path: dist/Rufin.dmg
          if-no-files-found: error
          retention-days: 7

  release:
    name: Upload macOS release asset
    if: github.event_name == 'release' || inputs.upload_release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download workflow artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: Rufin.dmg
          path: dist

      - name: Generate checksum
        run: sha256sum dist/Rufin.dmg > dist/Rufin.dmg.sha256

      - name: Attest macOS disk image
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/Rufin.dmg

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.upload_release_tag }}
        run: gh release upload "$RELEASE_TAG" dist/Rufin.dmg dist/Rufin.dmg.sha256 --clobber --repo "$GITHUB_REPOSITORY"
