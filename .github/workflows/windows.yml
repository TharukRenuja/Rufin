name: Windows

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: main
      upload_release_tag:
        description: Optional existing GitHub release tag to upload the installer to
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: windows-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.upload_release_tag || github.ref }}
  cancel-in-progress: true

env:
  MSYSTEM: UCRT64
  CHERE_INVOKING: 1

jobs:
  setup:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Validate release target
        if: github.event_name == 'release' || inputs.upload_release_tag != ''
        shell: bash
        env:
          BUILD_REF: ${{ inputs.ref }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.upload_release_tag }}
        run: |
          set -euo pipefail
          release_tag="$RELEASE_TAG"
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            build_ref="$BUILD_REF"
            if [[ "$build_ref" != "$release_tag" && "$build_ref" != "refs/tags/$release_tag" ]]; then
              echo "Manual release uploads must build the same tag they upload" >&2
              exit 1
            fi
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up MSYS2
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
            gnupg
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gdk-pixbuf2
            mingw-w64-ucrt-x86_64-gettext-runtime
            mingw-w64-ucrt-x86_64-gettext-tools
            mingw-w64-ucrt-x86_64-gst-libav
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-ugly
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-hicolor-icon-theme
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-perl
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-shared-mime-info
            mingw-w64-ucrt-x86_64-toolchain

      - name: Verify signed release tag
        if: github.event_name == 'release' || inputs.upload_release_tag != ''
        shell: msys2 {0}
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.upload_release_tag }}
        run: cargo run --locked -p xtask -- verify release-tag "$RELEASE_TAG"

      - name: Validate release metadata
        if: github.event_name == 'release' || inputs.upload_release_tag != ''
        shell: msys2 {0}
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.upload_release_tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          metainfo_version="$(
            sed -n 's/.*<release version="\([^"]*\)".*/\1/p' data/io.github.screwys.Rufin.metainfo.xml |
              head -n 1
          )"

          test "$version" = "$cargo_version"
          test "$version" = "$metainfo_version"

      - name: Test platform integrations
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cargo test --locked -p secrets
          cargo test --locked -p desktop-integration
          cargo test --locked -p sources metadata_
          cargo test --locked -p rufin settings_

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          $makensis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            throw "NSIS was not installed at $makensis"
          }
          "RUFIN_MAKENSIS=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Windows installer
        shell: msys2 {0}
        run: |
          set -euo pipefail
          RUFIN_ARTIFACT_ROOT="$PWD/dist" packaging/windows/build

      - name: Create media verification files
        shell: msys2 {0}
        run: bash scripts/create-media-verification-files "$RUNNER_TEMP/rufin-package-media"

      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter "Rufin-*-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer was not produced"
          }
          $installDir = Join-Path $env:RUNNER_TEMP "Rufin"
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          Set-Content -NoNewline -Path (Join-Path $installDir "rufin.exe") -Value "legacy"
          Set-Content -NoNewline -Path (Join-Path $installDir "legacy-runtime.dll") -Value "legacy"
          $desktopShortcut = Join-Path ([Environment]::GetFolderPath("Desktop")) "Rufin.lnk"
          $shortcutShell = New-Object -ComObject WScript.Shell
          $legacyShortcut = $shortcutShell.CreateShortcut($desktopShortcut)
          $legacyShortcut.TargetPath = Join-Path $installDir "rufin.exe"
          $legacyShortcut.Save()

          $installerArgs = @("/S", "/D=$installDir")
          $process = Start-Process -FilePath $installer.FullName -ArgumentList $installerArgs -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Windows installer exited with code $($process.ExitCode)"
          }

          $installedBin = Join-Path $installDir "bin"
          $installedExe = Join-Path $installedBin "rufin.exe"
          $deadline = (Get-Date).AddSeconds(60)
          while (-not (Test-Path $installedExe) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 250
          }
          if (-not (Test-Path $installedExe)) {
            throw "Installed Rufin executable was not found: $installedExe"
          }
          foreach ($legacyRuntime in @("rufin.exe", "legacy-runtime.dll")) {
            $legacyPath = Join-Path $installDir $legacyRuntime
            if (Test-Path $legacyPath) {
              throw "Legacy Windows runtime was not removed: $legacyPath"
            }
          }
          $desktopTarget = $shortcutShell.CreateShortcut($desktopShortcut).TargetPath
          if ($desktopTarget -ne $installedExe) {
            throw "Desktop shortcut still targets the legacy runtime: $desktopTarget"
          }
          $startMenuShortcut = Join-Path ([Environment]::GetFolderPath("Programs")) "Rufin\Rufin.lnk"
          $startMenuTarget = $shortcutShell.CreateShortcut($startMenuShortcut).TargetPath
          if ($startMenuTarget -ne $installedExe) {
            throw "Start Menu shortcut does not target the installed executable: $startMenuTarget"
          }
          $installedDlls = @(Get-ChildItem -LiteralPath $installedBin -Filter "*.dll" -File)
          Write-Host "Installed Rufin runtime has $($installedDlls.Count) DLLs"
          if ($installedDlls.Count -eq 0) {
            throw "Installed Rufin runtime has no DLLs"
          }

          $runtimeStdout = Join-Path $env:RUNNER_TEMP "rufin-runtime.out"
          $runtimeStderr = Join-Path $env:RUNNER_TEMP "rufin-runtime.err"
          $previousPath = $env:PATH
          try {
            $env:PATH = "$installedBin;$env:SystemRoot\System32;$env:SystemRoot"
            $mediaDirectory = Join-Path $env:RUNNER_TEMP "rufin-package-media"
            foreach ($media in Get-ChildItem -LiteralPath $mediaDirectory -File) {
              $runtimeProcess = Start-Process `
                -FilePath $installedExe `
                -ArgumentList @("--verify-media", $media.FullName) `
                -WorkingDirectory $installDir `
                -RedirectStandardOutput $runtimeStdout `
                -RedirectStandardError $runtimeStderr `
                -PassThru
              if (-not $runtimeProcess.WaitForExit(30000)) {
                Stop-Process -Id $runtimeProcess.Id -Force
                throw "Installed Rufin media check timed out: $($media.Name)"
              }
              if ($runtimeProcess.ExitCode -ne 0) {
                throw "Installed Rufin could not read $($media.Name)"
              }
            }
          } catch {
            Get-ChildItem $installDir | Select-Object Name, Length
            throw "Installed Rufin executable failed to start: $_"
          } finally {
            $env:PATH = $previousPath
          }
          foreach ($runtimeLog in @($runtimeStdout, $runtimeStderr)) {
            if ((Test-Path $runtimeLog) -and (Get-Item $runtimeLog).Length -gt 0) {
              Get-Content $runtimeLog
            }
          }
      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Rufin-setup.exe
          path: dist/Rufin-*-setup.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: Upload Windows release asset
    if: github.event_name == 'release' || inputs.upload_release_tag != ''
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download workflow artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: Rufin-setup.exe
          path: dist

      - name: Generate checksum
        run: |
          set -euo pipefail
          installer="$(find dist -maxdepth 1 -name 'Rufin-*-setup.exe' -print -quit)"
          test -n "$installer"
          sha256sum "$installer" > "$installer.sha256"

      - name: Attest Windows installer
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/Rufin-*-setup.exe

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.upload_release_tag }}
        run: |
          set -euo pipefail
          installer="$(find dist -maxdepth 1 -name 'Rufin-*-setup.exe' -print -quit)"
          test -n "$installer"
          gh release upload "$RELEASE_TAG" "$installer" "$installer.sha256" --clobber --repo "$GITHUB_REPOSITORY"
