name: Container image

on:
  push:
    branches:
      - main
    paths:
      - packaging/container/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-image-${{ github.event_name == 'push' && 'publish' || github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build container image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rufin-dev"
          docker build \
            --file packaging/container/Containerfile \
            --tag localhost/rufin-dev:ci \
            --tag "$image:latest" \
            --tag "$image:$GITHUB_SHA" \
            packaging/container

      - name: Check Rufin through image
        env:
          RUFIN_CONTAINER_IMAGE: localhost/rufin-dev:ci
          RUFIN_CONTAINER_RUNTIME: docker
        run: |
          scripts/container setup
          scripts/container run just check

      - name: Log in to GHCR
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish image
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rufin-dev"
          docker push "$image:$GITHUB_SHA"
          docker push "$image:latest"

      - name: Log out of GHCR
        if: always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
        run: docker logout ghcr.io

      - name: Check public image
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rufin-dev"
          docker image rm "$image:$GITHUB_SHA" "$image:latest"
          docker pull "$image:latest"
