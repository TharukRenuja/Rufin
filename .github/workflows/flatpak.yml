name: Flatpak

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: main
      upload_release_tag:
        description: Optional existing GitHub release tag to upload the bundle to
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.upload_release_tag || github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_NAME: io.github.screwys.Rufin.flatpak

jobs:
  validate:
    name: Validate release target
    runs-on: ubuntu-latest

    steps:
      - name: Validate manual release target
        if: github.event_name == 'workflow_dispatch' && inputs.upload_release_tag != ''
        env:
          BUILD_REF: ${{ inputs.ref }}
          RELEASE_TAG: ${{ inputs.upload_release_tag }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_REF" != "$RELEASE_TAG" && "$BUILD_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            echo "Manual release uploads must build the same tag they upload" >&2
            exit 1
          fi

  build:
    name: Flatpak
    needs: validate
    uses: ./.github/workflows/flatpak-build.yml
    with:
      ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref }}
      release_tag: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.upload_release_tag }}
      verify_signed_tag: ${{ github.event_name == 'release' || inputs.upload_release_tag != '' }}

  release:
    name: Upload Flatpak release asset
    if: github.event_name == 'release' || inputs.upload_release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download workflow artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ env.BUNDLE_NAME }}
          path: dist

      - name: Attest Flatpak bundle
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/${{ env.BUNDLE_NAME }}

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.upload_release_tag }}
        run: |
          gh release upload \
            "$RELEASE_TAG" \
            "dist/$BUNDLE_NAME" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
