name: AUR

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to build or publish
        required: true
        default: both
        type: choice
        options:
          - both
          - rufin
          - rufin-git
      publish:
        description: Push PKGBUILD and .SRCINFO to AUR
        required: true
        default: false
        type: boolean
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  aur:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel \
            curl \
            appstream \
            desktop-file-utils \
            gdk-pixbuf2 \
            gettext \
            git \
            gst-libav \
            gst-plugins-bad \
            gst-plugins-base \
            gst-plugins-good \
            gst-plugins-ugly \
            gtk4 \
            hicolor-icon-theme \
            libadwaita \
            openssh \
            pkgconf \
            rust

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare builder user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Prepare release package from release tag
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          tag_name="${{ github.event.release.tag_name }}"
          version="${tag_name#v}"
          pkgbuild="packaging/aur/rufin/PKGBUILD"
          checksum="$(
            curl -LfsS "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/v${version}.tar.gz" |
              sha256sum |
              awk '{print $1}'
          )"
          sed -i "s/^pkgver=.*/pkgver=${version}/" "$pkgbuild"
          sed -i "s/^sha256sums=.*/sha256sums=('${checksum}')/" "$pkgbuild"

      - name: Configure AUR SSH
        if: github.event_name == 'release' || inputs.publish
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${AUR_SSH_PRIVATE_KEY}" ]]; then
            echo "AUR_SSH_PRIVATE_KEY is not set" >&2
            exit 1
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          secret_fingerprint="$(
            ssh-keygen -y -f ~/.ssh/aur |
              ssh-keygen -lf - |
              awk '{print $2}'
          )"
          echo "AUR SSH key fingerprint: ${secret_fingerprint}"
          test "$secret_fingerprint" = "SHA256:B9M3ivEcGuf7RqkzyXLTAytU4AlBW5NcACn7PayJZmg"

          ssh-keyscan aur.archlinux.org > ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts |
            grep -q "SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4"

          {
            echo "Host aur.archlinux.org"
            echo "  User aur"
            echo "  IdentityFile $HOME/.ssh/aur"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  UserKnownHostsFile $HOME/.ssh/known_hosts"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

          git config --global user.name "screwys"
          git config --global user.email "254296947+screwys@users.noreply.github.com"
          git config --global core.sshCommand \
            "ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"

      - name: Build packages
        run: |
          set -euo pipefail

          package="${{ inputs.package || 'rufin' }}"
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            package="rufin"
          fi

          case "$package" in
            both) packages=(rufin rufin-git) ;;
            rufin) packages=(rufin) ;;
            rufin-git) packages=(rufin-git) ;;
            *) echo "unknown package: $package" >&2; exit 1 ;;
          esac

          for aur_package in "${packages[@]}"; do
            runuser -u builder -- bash -lc "
              set -euo pipefail
              export PATH=/usr/local/sbin:/usr/local/bin:/usr/bin:/bin
              cd '$GITHUB_WORKSPACE/packaging/aur/$aur_package'
              rm -rf src pkg
              makepkg --cleanbuild --clean --noconfirm --noprogressbar
              makepkg --printsrcinfo > .SRCINFO
            "
          done

      - name: Verify built packages
        run: |
          set -euo pipefail

          package="${{ inputs.package || 'rufin' }}"
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            package="rufin"
          fi

          case "$package" in
            both) packages=(rufin rufin-git) ;;
            rufin) packages=(rufin) ;;
            rufin-git) packages=(rufin-git) ;;
            *) echo "unknown package: $package" >&2; exit 1 ;;
          esac

          for aur_package in "${packages[@]}"; do
            pkgfile="$(
              find "$GITHUB_WORKSPACE/packaging/aur/$aur_package" \
                -maxdepth 1 \
                -name "${aur_package}-*.pkg.tar.zst" \
                ! -name "${aur_package}-debug-*.pkg.tar.zst" \
                -print \
                -quit
            )"
            test -n "$pkgfile"

            pacman -U --noconfirm "$pkgfile"
            test -x /usr/bin/rufin
            rufin --help >/dev/null
            desktop-file-validate /usr/share/applications/io.github.screwys.Rufin.desktop
            appstreamcli validate --no-net /usr/share/metainfo/io.github.screwys.Rufin.metainfo.xml
            pacman -Rns --noconfirm "$aur_package"
          done

      - name: Publish packages
        if: github.event_name == 'release' || inputs.publish
        run: |
          set -euo pipefail

          package="${{ inputs.package || 'rufin' }}"
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            package="rufin"
          fi

          case "$package" in
            both) packages=(rufin rufin-git) ;;
            rufin) packages=(rufin) ;;
            rufin-git) packages=(rufin-git) ;;
            *) echo "unknown package: $package" >&2; exit 1 ;;
          esac

          tmpdir="$(mktemp -d)"
          for aur_package in "${packages[@]}"; do
            repo="$tmpdir/$aur_package"
            if ! git clone "ssh://aur@aur.archlinux.org/${aur_package}.git" "$repo"; then
              mkdir -p "$repo"
              git -C "$repo" init -b master
              git -C "$repo" remote add origin "ssh://aur@aur.archlinux.org/${aur_package}.git"
            fi

            cp "packaging/aur/$aur_package/PKGBUILD" "$repo/PKGBUILD"
            cp "packaging/aur/$aur_package/.SRCINFO" "$repo/.SRCINFO"

            git -C "$repo" add PKGBUILD .SRCINFO
            if [[ -z "$(git -C "$repo" status --porcelain)" ]]; then
              echo "No AUR changes for $aur_package"
              continue
            fi

            if git -C "$repo" rev-parse --verify HEAD >/dev/null 2>&1; then
              message="Update package"
            else
              message="Initial import"
            fi
            git -C "$repo" commit -m "$message"
            git -C "$repo" push origin master
          done
