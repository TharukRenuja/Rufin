name: AUR

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      package:
        description: Package to build or publish
        required: true
        default: both
        type: choice
        options:
          - both
          - rufin
          - rufin-git
      publish:
        description: Push PKGBUILD and .SRCINFO to AUR
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: aur-${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AUR packages
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel \
            curl \
            appstream \
            dbus \
            desktop-file-utils \
            gdk-pixbuf2 \
            gettext \
            git \
            gst-libav \
            gst-plugins-bad \
            gst-plugins-base \
            gst-plugins-good \
            gst-plugins-ugly \
            gtk4 \
            hicolor-icon-theme \
            libadwaita \
            openssh \
            pkgconf \
            rust \
            xorg-server-xvfb

      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'push' && github.ref_name || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare builder user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify signed release tag
        if: github.event_name == 'release' || github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
        run: bash .github/scripts/verify-signed-release-tag.sh "$RELEASE_TAG"

      - name: Validate release tag
        if: github.event_name == 'release' || github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          tag_name="$RELEASE_TAG"
          if [[ ! "$tag_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

      - name: Validate release metadata
        if: github.event_name == 'release' || github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          metainfo_version="$(
            sed -n 's/.*<release version="\([^"]*\)".*/\1/p' data/io.github.screwys.Rufin.metainfo.xml |
              head -n 1
          )"

          test "$version" = "$cargo_version"
          test "$version" = "$metainfo_version"

      - name: Prepare release package from release tag
        if: github.event_name == 'release' || github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          bash .github/scripts/update-aur-stable-package.sh --skip-srcinfo "$RELEASE_TAG"

      - name: Build packages
        env:
          REQUESTED_PACKAGE: ${{ inputs.package || 'rufin' }}
        run: |
          set -euo pipefail

          package="$REQUESTED_PACKAGE"
          if [[ "$GITHUB_EVENT_NAME" == "release" || "$GITHUB_EVENT_NAME" == "push" ]]; then
            package="rufin"
          fi

          case "$package" in
            both) packages=(rufin rufin-git) ;;
            rufin) packages=(rufin) ;;
            rufin-git) packages=(rufin-git) ;;
            *) echo "unknown package: $package" >&2; exit 1 ;;
          esac

          for aur_package in "${packages[@]}"; do
            runuser -u builder -- bash -lc "
              set -euo pipefail
              export PATH=/usr/local/sbin:/usr/local/bin:/usr/bin:/bin
              cd '$GITHUB_WORKSPACE/packaging/aur/$aur_package'
              rm -rf src pkg
              makepkg --cleanbuild --clean --noconfirm --noprogressbar
              makepkg --printsrcinfo > .SRCINFO
            "
          done

      - name: Verify built packages
        env:
          REQUESTED_PACKAGE: ${{ inputs.package || 'rufin' }}
        run: |
          set -euo pipefail

          package="$REQUESTED_PACKAGE"
          if [[ "$GITHUB_EVENT_NAME" == "release" || "$GITHUB_EVENT_NAME" == "push" ]]; then
            package="rufin"
          fi

          case "$package" in
            both) packages=(rufin rufin-git) ;;
            rufin) packages=(rufin) ;;
            rufin-git) packages=(rufin-git) ;;
            *) echo "unknown package: $package" >&2; exit 1 ;;
          esac

          for aur_package in "${packages[@]}"; do
            pkgfile="$(
              find "$GITHUB_WORKSPACE/packaging/aur/$aur_package" \
                -maxdepth 1 \
                -name "${aur_package}-*.pkg.tar.zst" \
                ! -name "${aur_package}-debug-*.pkg.tar.zst" \
                -print \
                -quit
            )"
            test -n "$pkgfile"

            pacman -U --noconfirm "$pkgfile"
            bash .github/scripts/verify-package-layout.sh / /usr
            timeout 30s xvfb-run -a dbus-run-session -- rufin --startup-check
            desktop-file-validate /usr/share/applications/io.github.screwys.Rufin.desktop
            appstreamcli validate --no-net /usr/share/metainfo/io.github.screwys.Rufin.metainfo.xml
            pacman -Rns --noconfirm "$aur_package"
          done

      - name: Upload package metadata
        if: github.event_name == 'release' || github.event_name == 'push' || inputs.publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aur-package-metadata
          path: |
            packaging/aur/rufin/PKGBUILD
            packaging/aur/rufin/.SRCINFO
            packaging/aur/rufin-git/PKGBUILD
            packaging/aur/rufin-git/.SRCINFO
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  publish:
    name: Publish AUR packages
    if: github.event_name == 'release' || github.event_name == 'push' || inputs.publish
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install publish dependencies
        run: |
          pacman -Syu --noconfirm --needed git openssh

      - name: Validate manual publish target
        if: github.event_name == 'workflow_dispatch'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUESTED_PACKAGE: ${{ inputs.package || 'rufin' }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Manual AUR publishing must be dispatched from $DEFAULT_BRANCH" >&2
            exit 1
          fi

          case "$REQUESTED_PACKAGE" in
            both|rufin|rufin-git) ;;
            *) echo "unknown package: $REQUESTED_PACKAGE" >&2; exit 1 ;;
          esac

      - name: Validate manual stable package metadata
        if: github.event_name == 'workflow_dispatch' && (inputs.package == 'rufin' || inputs.package == 'both')
        run: |
          set -euo pipefail
          version="$(
            sed -n 's/^pkgver=\(.*\)$/\1/p' packaging/aur/rufin/PKGBUILD |
              head -n 1
          )"
          tag="v$version"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Stable AUR package must point at a version tag" >&2
            exit 1
          fi

          git fetch --force origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/tags/${tag}:refs/tags/${tag}"

          if [[ "$(git cat-file -t "refs/tags/$tag")" != "tag" ]]; then
            echo "Stable AUR tag must be an annotated signed tag" >&2
            exit 1
          fi

          if ! git cat-file tag "refs/tags/$tag" | grep -q '^-----BEGIN PGP SIGNATURE-----$'; then
            echo "Stable AUR tag must contain a PGP signature" >&2
            exit 1
          fi

          if [[ -f .github/release-gpg.pub ]]; then
            gnupg_home="$(mktemp -d)"
            cleanup() {
              rm -rf "$gnupg_home"
            }
            trap cleanup EXIT
            chmod 700 "$gnupg_home"
            export GNUPGHOME="$gnupg_home"
            gpg --batch --import .github/release-gpg.pub >/dev/null 2>&1
            git verify-tag "refs/tags/$tag" >/dev/null 2>&1
          fi

          tag_commit="$(git rev-list -n1 "refs/tags/$tag")"
          git merge-base --is-ancestor "$tag_commit" origin/main
          bash .github/scripts/update-aur-stable-package.sh --check "$tag"

      - name: Download package metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: aur-package-metadata
          path: .

      - name: Configure AUR SSH
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${AUR_SSH_PRIVATE_KEY}" ]]; then
            echo "AUR_SSH_PRIVATE_KEY is not set" >&2
            exit 1
          fi

          install -d -m 700 ~/.ssh
          key_file="$HOME/.ssh/aur"
          key_material="${AUR_SSH_PRIVATE_KEY//$'\r'/}"
          if [[ "$key_material" == *"\\n"* ]]; then
            printf '%b' "$key_material" > "$key_file"
            printf '\n' >> "$key_file"
          elif [[ "$key_material" == *"-----BEGIN "* ]]; then
            printf '%s\n' "$key_material" > "$key_file"
          elif printf '%s' "$key_material" | base64 -d > "$key_file.tmp" 2>/dev/null; then
            mv "$key_file.tmp" "$key_file"
          else
            printf '%s\n' "$key_material" > "$key_file"
          fi
          rm -f "$key_file.tmp"
          chmod 600 ~/.ssh/aur
          if ! head -n 1 "$key_file" | grep -q '^-----BEGIN .*PRIVATE KEY-----$'; then
            echo "AUR_SSH_PRIVATE_KEY is not an OpenSSH private key after decoding" >&2
            exit 1
          fi
          echo "AUR SSH key lines: $(wc -l < "$key_file")"
          secret_fingerprint="$(
            ssh-keygen -y -f ~/.ssh/aur |
              ssh-keygen -lf - |
              awk '{print $2}'
          )"
          echo "AUR SSH key fingerprint: ${secret_fingerprint}"
          test "$secret_fingerprint" = "SHA256:N1BBpqTVHS0EDGTCEVNjw02KpaR4onZs8LisHRnsPww"

          ssh-keyscan aur.archlinux.org > ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts |
            grep -q "SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4"

          {
            echo "Host aur.archlinux.org"
            echo "  User aur"
            echo "  IdentityFile $HOME/.ssh/aur"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  UserKnownHostsFile $HOME/.ssh/known_hosts"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

          git config --global user.name "screwys"
          git config --global user.email "254296947+screwys@users.noreply.github.com"
          git config --global core.sshCommand \
            "ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"

      - name: Publish packages
        env:
          REQUESTED_PACKAGE: ${{ inputs.package || 'rufin' }}
        run: |
          set -euo pipefail

          package="$REQUESTED_PACKAGE"
          if [[ "$GITHUB_EVENT_NAME" == "release" || "$GITHUB_EVENT_NAME" == "push" ]]; then
            package="rufin"
          fi

          case "$package" in
            both) packages=(rufin rufin-git) ;;
            rufin) packages=(rufin) ;;
            rufin-git) packages=(rufin-git) ;;
            *) echo "unknown package: $package" >&2; exit 1 ;;
          esac

          tmpdir="$(mktemp -d)"
          for aur_package in "${packages[@]}"; do
            repo="$tmpdir/$aur_package"
            if ! git clone "ssh://aur@aur.archlinux.org/${aur_package}.git" "$repo"; then
              mkdir -p "$repo"
              git -C "$repo" init -b master
              git -C "$repo" remote add origin "ssh://aur@aur.archlinux.org/${aur_package}.git"
            fi

            cp "$aur_package/PKGBUILD" "$repo/PKGBUILD"
            cp "$aur_package/.SRCINFO" "$repo/.SRCINFO"

            git -C "$repo" add PKGBUILD .SRCINFO
            if [[ -z "$(git -C "$repo" status --porcelain)" ]]; then
              echo "No AUR changes for $aur_package"
              continue
            fi

            if git -C "$repo" rev-parse --verify HEAD >/dev/null 2>&1; then
              message="Update package"
            else
              message="Initial import"
            fi
            git -C "$repo" commit -m "$message"
            git -C "$repo" push origin master
          done
