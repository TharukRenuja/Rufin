name: AUR

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      package:
        description: Package to build or publish
        required: true
        default: rufin-bin
        type: choice
        options:
          - rufin-bin
          - rufin-git
          - both
      release_tag:
        description: Existing release tag required for rufin-bin
        required: false
        default: ""
      publish:
        description: Upload release assets and push AUR metadata
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: aur-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare AUR build
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.select.outputs.package }}
      release_tag: ${{ steps.select.outputs.release_tag }}

    steps:
      - name: Select packages and release
        id: select
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
          PUBLISH: ${{ inputs.publish }}
          REQUESTED_PACKAGE: ${{ inputs.package }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            package="rufin-bin"
            release_tag="$RELEASE_EVENT_TAG"
          else
            package="$REQUESTED_PACKAGE"
            release_tag="$REQUESTED_TAG"
          fi

          case "$package" in
            rufin-bin|rufin-git|both) ;;
            *) echo "Unknown package: $package" >&2; exit 1 ;;
          esac

          if [[ "$package" == "rufin-bin" || "$package" == "both" ]]; then
            if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
              echo "rufin-bin requires a release tag such as v0.9.0" >&2
              exit 1
            fi
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$PUBLISH" == "true" && "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Manual AUR publishing must be dispatched from $DEFAULT_BRANCH" >&2
            exit 1
          fi

          {
            echo "package=$package"
            echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"

  bin-package:
    name: Build rufin-bin package
    needs: prepare
    if: needs.prepare.outputs.package == 'rufin-bin' || needs.prepare.outputs.package == 'both'
    runs-on: ubuntu-24.04
    container: archlinux:latest

    steps:
      - name: Install bootstrap tools
        run: pacman -Syu --noconfirm --needed base-devel git

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event_name == 'release' && needs.prepare.outputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install build and runtime dependencies
        run: |
          set -euo pipefail
          mapfile -t dependencies < <(bash scripts/check-deps --arch-build-packages)
          pacman -S --noconfirm --needed \
            appstream \
            desktop-file-utils \
            "${dependencies[@]}"

      - name: Prepare builder user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          install -d -o builder -g builder /home/builder/target "$GITHUB_WORKSPACE/dist"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify release tag and architecture
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          source_dir="/home/builder/rufin-source"
          runuser -u builder -- git -C "$GITHUB_WORKSPACE" worktree add --detach "$source_dir" "$RELEASE_TAG"
          runuser -u builder -- bash -lc "
            set -euo pipefail
            export PATH=/usr/local/sbin:/usr/local/bin:/usr/bin:/bin
            cd '$source_dir'
            CARGO_TARGET_DIR=/home/builder/target \
              cargo run --locked -p xtask -- verify release-tag '$RELEASE_TAG'
          "
          test "$(uname -m)" = "x86_64"

      - name: Build release payload
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          source_dir="/home/builder/rufin-source"
          version="${RELEASE_TAG#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' "$source_dir/Cargo.toml" | head -n 1)"
          metainfo_version="$(
            sed -n 's/.*<release version="\([^"]*\)".*/\1/p' \
              "$source_dir/data/io.github.screwys.Rufin.metainfo.xml" |
              head -n 1
          )"
          test "$cargo_version" = "$version"
          test "$metainfo_version" = "$version"

          staging="/home/builder/package-root"
          target_dir="/home/builder/target"
          install -d -o builder -g builder "$staging"
          runuser -u builder -- bash -lc "
            set -euo pipefail
            export PATH=/usr/local/sbin:/usr/local/bin:/usr/bin:/bin
            cd '$source_dir'
            CARGO_TARGET_DIR='$target_dir' cargo build --frozen --release -p rufin
          "

          install -Dm755 "$target_dir/release/rufin" "$staging/usr/bin/rufin"
          strip --strip-unneeded "$staging/usr/bin/rufin"
          install -Dm644 "$source_dir/data/io.github.screwys.Rufin.desktop" \
            "$staging/usr/share/applications/io.github.screwys.Rufin.desktop"
          install -Dm644 "$source_dir/data/io.github.screwys.Rufin.metainfo.xml" \
            "$staging/usr/share/metainfo/io.github.screwys.Rufin.metainfo.xml"
          install -Dm644 "$source_dir/data/icons/hicolor/scalable/apps/io.github.screwys.Rufin.svg" \
            "$staging/usr/share/icons/hicolor/scalable/apps/io.github.screwys.Rufin.svg"
          install -Dm644 -t "$staging/usr/share/icons/hicolor/scalable/actions" \
            "$source_dir"/data/icons/hicolor/scalable/actions/*.svg
          install -Dm644 -t "$staging/usr/share/icons/hicolor/scalable/status" \
            "$source_dir"/data/icons/hicolor/scalable/status/*.svg
          install -Dm644 -t "$staging/usr/share/icons/hicolor/512x512/apps" \
            "$source_dir"/data/icons/hicolor/512x512/apps/*.png
          install -Dm644 -t "$staging/usr/share/icons/hicolor/64x64/apps" \
            "$source_dir"/data/icons/hicolor/64x64/apps/*.png
          for po_file in "$source_dir"/crates/localization/locales/*.po; do
            language="${po_file##*/}"
            language="${language%.po}"
            install -dm755 "$staging/usr/share/locale/$language/LC_MESSAGES"
            msgfmt "$po_file" \
              -o "$staging/usr/share/locale/$language/LC_MESSAGES/rufin.mo"
          done

          runuser -u builder -- bash -lc "
            export PATH=/usr/local/sbin:/usr/local/bin:/usr/bin:/bin
            cd '$source_dir'
            CARGO_TARGET_DIR='$target_dir' \
              cargo run --locked -p xtask -- verify package-layout '$staging' /usr
          "
          commit_time="$(runuser -u builder -- git -C "$source_dir" show -s --format=%ct HEAD)"
          tar \
            --sort=name \
            --mtime="@$commit_time" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --use-compress-program='zstd -19 -T0' \
            -cf "$GITHUB_WORKSPACE/dist/rufin-${version}-archlinux-x86_64.tar.zst" \
            -C "$staging" \
            usr

      - name: Render and build rufin-bin
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          asset_version="${RELEASE_TAG#v}"
          pkgver="${asset_version//-/_}"
          output="$GITHUB_WORKSPACE/dist/aur-bin"
          archive="dist/rufin-${asset_version}-archlinux-x86_64.tar.zst"
          checksum="$(sha256sum "$archive" | awk '{print $1}')"
          install -d -o builder -g builder "$output"
          sed \
            -e "s/@PKGVER@/$pkgver/g" \
            -e "s/@ASSET_VERSION@/$asset_version/g" \
            -e "s/@X86_64_SHA256@/$checksum/g" \
            packaging/aur/rufin-bin/PKGBUILD.template > "$output/PKGBUILD"
          if grep -nE '@(PKGVER|ASSET_VERSION|X86_64_SHA256)@' "$output/PKGBUILD"; then
            echo "Rendered PKGBUILD still contains placeholders" >&2
            exit 1
          fi
          cp "$archive" "$output/"
          printf '%s  %s\n' \
            "$checksum" \
            "$(basename "$archive")" > "$output/SHA256SUMS-archlinux"
          chown -R builder:builder "$output"
          runuser -u builder -- bash -lc "
            set -euo pipefail
            export PATH=/usr/local/sbin:/usr/local/bin:/usr/bin:/bin
            cd '$output'
            makepkg --cleanbuild --clean --noconfirm --noprogressbar
            makepkg --printsrcinfo > .SRCINFO
          "

      - name: Verify built rufin-bin package
        run: |
          set -euo pipefail
          pkgfile="$(find dist/aur-bin -maxdepth 1 -name 'rufin-bin-*.pkg.tar.zst' -print -quit)"
          test -n "$pkgfile"
          pkgroot="$(mktemp -d)"
          bsdtar -xf "$pkgfile" -C "$pkgroot"
          test -x "$pkgroot/usr/bin/rufin"
          test -f "$pkgroot/usr/share/applications/io.github.screwys.Rufin.desktop"
          test -f "$pkgroot/usr/share/metainfo/io.github.screwys.Rufin.metainfo.xml"
          pacman -U --noconfirm "$pkgfile"
          rufin --help >/dev/null
          desktop-file-validate /usr/share/applications/io.github.screwys.Rufin.desktop
          appstreamcli validate --no-net /usr/share/metainfo/io.github.screwys.Rufin.metainfo.xml
          pacman -Rns --noconfirm rufin-bin

      - name: Upload Arch payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: archlinux-x86_64
          path: dist/rufin-*-archlinux-x86_64.tar.zst
          if-no-files-found: error
          retention-days: 7

      - name: Upload rufin-bin metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aur-bin-metadata
          path: |
            dist/aur-bin/PKGBUILD
            dist/aur-bin/.SRCINFO
            dist/aur-bin/SHA256SUMS-archlinux
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  git-package:
    name: Build rufin-git package
    needs: prepare
    if: needs.prepare.outputs.package == 'rufin-git' || needs.prepare.outputs.package == 'both'
    runs-on: ubuntu-24.04
    container: archlinux:latest

    steps:
      - name: Install bootstrap tools
        run: pacman -Syu --noconfirm --needed base-devel git

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install package dependencies
        run: |
          set -euo pipefail
          mapfile -t dependencies < <(bash scripts/check-deps --arch-build-packages)
          pacman -S --noconfirm --needed \
            appstream \
            desktop-file-utils \
            "${dependencies[@]}"

      - name: Prepare builder user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build package
        run: |
          runuser -u builder -- bash -lc "
            set -euo pipefail
            export PATH=/usr/local/sbin:/usr/local/bin:/usr/bin:/bin
            cd '$GITHUB_WORKSPACE/packaging/aur/rufin-git'
            makepkg --cleanbuild --clean --noconfirm --noprogressbar
            makepkg --printsrcinfo > .SRCINFO
          "

      - name: Verify built package
        run: |
          set -euo pipefail
          pkgfile="$(find packaging/aur/rufin-git -maxdepth 1 -name 'rufin-git-*.pkg.tar.zst' ! -name '*-debug-*' -print -quit)"
          test -n "$pkgfile"
          pkgroot="$(mktemp -d)"
          bsdtar -xf "$pkgfile" -C "$pkgroot"
          test -x "$pkgroot/usr/bin/rufin"
          test -f "$pkgroot/usr/share/applications/io.github.screwys.Rufin.desktop"
          test -f "$pkgroot/usr/share/metainfo/io.github.screwys.Rufin.metainfo.xml"
          pacman -U --noconfirm "$pkgfile"
          rufin --help >/dev/null
          desktop-file-validate /usr/share/applications/io.github.screwys.Rufin.desktop
          appstreamcli validate --no-net /usr/share/metainfo/io.github.screwys.Rufin.metainfo.xml
          pacman -Rns --noconfirm rufin-git

      - name: Stage rufin-git metadata
        run: |
          mkdir -p dist/aur-git
          cp packaging/aur/rufin-git/PKGBUILD packaging/aur/rufin-git/.SRCINFO dist/aur-git/

      - name: Upload rufin-git metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aur-git-metadata
          path: |
            dist/aur-git/PKGBUILD
            dist/aur-git/.SRCINFO
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  release-assets:
    name: Upload Arch release assets
    needs:
      - prepare
      - bin-package
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download Arch payloads
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: archlinux-*
          path: dist
          merge-multiple: true

      - name: Download checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: aur-bin-metadata
          path: metadata

      - name: Verify release assets
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -name 'rufin-*-archlinux-x86_64.tar.zst' | wc -l)" -eq 1
          cp metadata/SHA256SUMS-archlinux dist/
          (cd dist && sha256sum --check SHA256SUMS-archlinux)

      - name: Attest Arch payloads
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        with:
          subject-path: dist/*.tar.zst

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload \
            "$RELEASE_TAG" \
            dist/*.tar.zst \
            dist/SHA256SUMS-archlinux \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

  publish:
    name: Publish AUR packages
    needs:
      - prepare
      - bin-package
      - git-package
      - release-assets
    if: always() && (github.event_name == 'release' || inputs.publish)
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Validate package results
        env:
          BIN_RESULT: ${{ needs.bin-package.result }}
          GIT_RESULT: ${{ needs.git-package.result }}
          PACKAGE: ${{ needs.prepare.outputs.package }}
          RELEASE_ASSETS_RESULT: ${{ needs.release-assets.result }}
        run: |
          set -euo pipefail
          if [[ "$PACKAGE" == "rufin-bin" || "$PACKAGE" == "both" ]]; then
            test "$BIN_RESULT" = "success"
            test "$RELEASE_ASSETS_RESULT" = "success"
          fi
          if [[ "$PACKAGE" == "rufin-git" || "$PACKAGE" == "both" ]]; then
            test "$GIT_RESULT" = "success"
          fi

      - name: Install publish dependencies
        run: pacman -Syu --noconfirm --needed git openssh

      - name: Download rufin-bin metadata
        if: needs.prepare.outputs.package == 'rufin-bin' || needs.prepare.outputs.package == 'both'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: aur-bin-metadata
          path: packages/rufin-bin

      - name: Download rufin-git metadata
        if: needs.prepare.outputs.package == 'rufin-git' || needs.prepare.outputs.package == 'both'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: aur-git-metadata
          path: packages/rufin-git

      - name: Configure AUR SSH
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${AUR_SSH_PRIVATE_KEY}" ]]; then
            echo "AUR_SSH_PRIVATE_KEY is not set" >&2
            exit 1
          fi

          install -d -m 700 ~/.ssh
          key_file="$HOME/.ssh/aur"
          key_material="${AUR_SSH_PRIVATE_KEY//$'\r'/}"
          if [[ "$key_material" == *"\\n"* ]]; then
            printf '%b' "$key_material" > "$key_file"
            printf '\n' >> "$key_file"
          elif [[ "$key_material" == *"-----BEGIN "* ]]; then
            printf '%s\n' "$key_material" > "$key_file"
          elif printf '%s' "$key_material" | base64 -d > "$key_file.tmp" 2>/dev/null; then
            mv "$key_file.tmp" "$key_file"
          else
            printf '%s\n' "$key_material" > "$key_file"
          fi
          rm -f "$key_file.tmp"
          chmod 600 "$key_file"
          if ! head -n 1 "$key_file" | grep -q '^-----BEGIN .*PRIVATE KEY-----$'; then
            echo "AUR_SSH_PRIVATE_KEY is not an OpenSSH private key after decoding" >&2
            exit 1
          fi
          secret_fingerprint="$(
            ssh-keygen -y -f "$key_file" |
              ssh-keygen -lf - |
              awk '{print $2}'
          )"
          test "$secret_fingerprint" = "SHA256:N1BBpqTVHS0EDGTCEVNjw02KpaR4onZs8LisHRnsPww"

          ssh-keyscan aur.archlinux.org > ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts |
            grep -q "SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4"

          git config --global user.name "screwys"
          git config --global user.email "254296947+screwys@users.noreply.github.com"
          git config --global core.sshCommand \
            "ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"

      - name: Publish packages
        env:
          REQUESTED_PACKAGE: ${{ needs.prepare.outputs.package }}
        run: |
          set -euo pipefail
          case "$REQUESTED_PACKAGE" in
            rufin-bin) packages=(rufin-bin) ;;
            rufin-git) packages=(rufin-git) ;;
            both) packages=(rufin-bin rufin-git) ;;
            *) echo "Unknown package: $REQUESTED_PACKAGE" >&2; exit 1 ;;
          esac

          tmpdir="$(mktemp -d)"
          for aur_package in "${packages[@]}"; do
            source_dir="$GITHUB_WORKSPACE/packages/$aur_package"
            repo="$tmpdir/$aur_package"
            if ! git clone "ssh://aur@aur.archlinux.org/${aur_package}.git" "$repo"; then
              mkdir -p "$repo"
              git -C "$repo" init -b master
              git -C "$repo" remote add origin "ssh://aur@aur.archlinux.org/${aur_package}.git"
            fi

            cp "$source_dir/PKGBUILD" "$repo/PKGBUILD"
            cp "$source_dir/.SRCINFO" "$repo/.SRCINFO"
            git -C "$repo" add PKGBUILD .SRCINFO
            if [[ -z "$(git -C "$repo" status --porcelain)" ]]; then
              echo "No AUR changes for $aur_package"
              continue
            fi

            if git -C "$repo" rev-parse --verify HEAD >/dev/null 2>&1; then
              message="Update package"
            else
              message="Initial import"
            fi
            git -C "$repo" commit -m "$message"
            git -C "$repo" push origin master
          done
