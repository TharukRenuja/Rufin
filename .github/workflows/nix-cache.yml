name: Nix Cache

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-cache-${{ github.ref }}
  cancel-in-progress: true

env:
  CACHIX_CACHE_NAME: rufin

jobs:
  build:
    name: Build current flake
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install runtime check tooling
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y dbus-x11 xvfb

      - name: Install Nix
        uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            connect-timeout = 10
            download-attempts = 5
            max-substitution-jobs = 4
            stalled-download-timeout = 90

      - name: Configure Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check flake
        run: bash scripts/retry-nix nix flake check --print-build-logs

      - name: Build app
        run: bash scripts/retry-nix nix build .#rufin --print-build-logs

      - name: Verify package layout
        run: cargo run --locked -p xtask -- verify package-layout result /

      - name: Verify wrapped app startup
        run: timeout 30s xvfb-run -a dbus-run-session -- bash scripts/retry-nix nix run .# -- --startup-check
