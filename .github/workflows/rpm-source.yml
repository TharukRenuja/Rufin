name: RPM source package

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref containing the RPM packaging tooling
        required: true
        type: string
      release_tag:
        description: Optional signed release tag to package
        required: false
        default: ""
        type: string
      verify_release_tag:
        description: Verify that the checked-out source is the release tag
        required: false
        default: false
        type: boolean
      upload_artifact:
        description: Upload the source RPM for a downstream job
        required: false
        default: false
        type: boolean
      verify_binary:
        description: Build, install, and verify the x86_64 RPM
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  srpm:
    name: Generate source RPM
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora-minimal:44
    defaults:
      run:
        shell: bash

    steps:
      - name: Install build tooling
        run: >-
          dnf -y --setopt=install_weak_deps=False install
          bash cargo coreutils findutils git gnupg2 rpm-build tar xz

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Trust checked-out repository
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Select release source
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          release_tag="$REQUESTED_TAG"
          if [[ -n "$release_tag" && ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - name: Verify release context
        env:
          VERIFY_RELEASE_TAG: ${{ inputs.verify_release_tag }}
        run: |
          set -euo pipefail
          gpg --batch --import .github/release-gpg.pub
          if [[ "$VERIFY_RELEASE_TAG" == "true" ]]; then
            test -n "$RELEASE_TAG"
            cargo run --locked -p xtask -- verify release-tag "$RELEASE_TAG"
          fi

      - name: Generate source RPM
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_TAG" ]]; then
            cargo run --locked -p xtask -- generate rpm-srpm "$RELEASE_TAG" --output dist
          else
            cargo run --locked -p xtask -- generate rpm-srpm --candidate-ref HEAD --output dist
          fi

      - name: Verify source RPM
        run: |
          set -euo pipefail
          mapfile -t source_rpms < <(find dist -maxdepth 1 -name 'rufin-*.src.rpm' -print)
          test "${#source_rpms[@]}" -eq 1
          (cd dist && sha256sum --check SHA256SUMS)
          rpm -K "${source_rpms[0]}"
          test "$(rpm -qp --queryformat '%{NAME}' "${source_rpms[0]}")" = rufin

      - name: Build and verify binary RPM
        if: inputs.verify_binary
        run: |
          set -euo pipefail
          source_rpm="$(find dist -maxdepth 1 -name 'rufin-*.src.rpm' -print -quit)"
          test -n "$source_rpm"
          dnf -y --setopt=install_weak_deps=False install \
            cpio \
            dnf5-plugins \
            gstreamer1-plugin-libav \
            gstreamer1-plugins-bad-free \
            gstreamer1-plugins-base \
            gstreamer1-plugins-good \
            gstreamer1-plugins-ugly-free \
            wavpack
          dnf -y --setopt=install_weak_deps=False builddep "$source_rpm"
          rpm_dir="$(rpm --eval '%{_rpmdir}')"
          test -n "$rpm_dir"
          rpmbuild --rebuild "$source_rpm"
          rpm_path="$(find "$rpm_dir" -type f -name 'rufin-[0-9]*.x86_64.rpm' -print -quit)"
          test -n "$rpm_path"
          rpm -K "$rpm_path"
          install_root="$(mktemp -d)"
          rpm2cpio "$rpm_path" | cpio -idm --quiet -D "$install_root"
          cargo run --locked -p xtask -- verify package-layout "$install_root" /usr
          dnf -y --setopt=install_weak_deps=False install "$rpm_path"
          cargo run --locked -p xtask -- generate media-verification-files /tmp/rufin-package-media
          for media in /tmp/rufin-package-media/*; do
            /usr/bin/rufin --verify-media "$media"
          done

      - name: Upload source RPM
        if: inputs.upload_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rpm-srpm
          path: dist/*.src.rpm
          if-no-files-found: error
          retention-days: 7
