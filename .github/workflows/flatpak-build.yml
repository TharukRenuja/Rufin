name: Flatpak build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: true
        type: string
      release_tag:
        description: Release version to validate
        default: ""
        required: false
        type: string
      verify_signed_tag:
        description: Verify that the release tag is signed
        default: false
        required: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: flatpak-build-${{ inputs.release_tag || inputs.ref }}
  cancel-in-progress: true

env:
  APP_ID: io.github.screwys.Rufin
  BUNDLE_NAME: io.github.screwys.Rufin.flatpak
  RUNTIME_REPO_URL: https://flathub.org/repo/flathub.flatpakrepo

jobs:
  bundle:
    name: Build Flatpak bundle
    runs-on: ubuntu-latest

    steps:
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            elfutils \
            flatpak \
            flatpak-builder \
            gstreamer1.0-libav \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-tools \
            librsvg2-common \
            wavpack
          flatpak remote-add --user --if-not-exists flathub "$RUNTIME_REPO_URL"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify signed release tag
        if: inputs.verify_signed_tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: cargo run --locked -p xtask -- verify release-tag "$RELEASE_TAG"

      - name: Validate release metadata
        if: inputs.release_tag != '' && !inputs.verify_signed_tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: cargo run --locked -p xtask -- verify release-metadata "$RELEASE_TAG"

      - name: Build Flatpak bundle
        env:
          RUFIN_ARTIFACT_ROOT: ${{ github.workspace }}/dist
        run: packaging/flatpak/build

      - name: Create media verification files
        run: >-
          cargo run --locked -p xtask -- generate media-verification-files
          "$RUNNER_TEMP/rufin-package-media" --with-openmpt-gme

      - name: Verify Flatpak bundle
        run: |
          set -euo pipefail
          flatpak install --user --noninteractive --bundle "dist/$BUNDLE_NAME"
          flatpak info --user "$APP_ID"
          install_root="$(flatpak info --user --show-location "$APP_ID")/files"
          cargo run --locked -p xtask -- verify package-layout "$install_root" /
          for media in "$RUNNER_TEMP"/rufin-package-media/*; do
            flatpak run \
              --filesystem="$RUNNER_TEMP/rufin-package-media:ro" \
              "$APP_ID" \
              --verify-media "$media"
          done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.BUNDLE_NAME }}
          path: dist/${{ env.BUNDLE_NAME }}
          if-no-files-found: error
          retention-days: 7
