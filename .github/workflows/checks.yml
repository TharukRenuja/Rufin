name: Checks

on:
  pull_request:
  push:
    branches:
      - main
      - release/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Workspace
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Check Flatpak cargo sources
        run: bash packaging/flatpak/update-cargo-sources.sh --check

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Check Rust formatting
        run: nix --accept-flake-config develop --command cargo fmt --all -- --check

      - name: Check Rust lints
        run: nix --accept-flake-config develop --command cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Rust tests
        run: nix --accept-flake-config develop --command cargo test --workspace --locked

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Check Rust dependency policy
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          arguments: --locked
          command: check
