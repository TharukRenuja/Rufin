name: Checks

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - .cargo/**
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - data/**
      - flake.lock
      - flake.nix
      - scripts/retry-nix
      - scripts/rust-cache-command
      - sgconfig.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CACHIX_CACHE_NAME: rufin

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      build_container_image: ${{ steps.select.outputs.build_container_image }}
      jobs: ${{ steps.select.outputs.jobs }}
      use_current_nix: ${{ steps.select.outputs.use_current_nix }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Classify changed paths
        if: github.event_name == 'pull_request'
        id: paths
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            workflows:
              - '.github/workflows/**'
            all_builds:
              - '.github/release-gpg.pub'
              - '.github/workflows/checks.yml'
            workspace:
              - '.cargo/**'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/**'
              - 'data/**'
              - 'flake.lock'
              - 'flake.nix'
              - 'sgconfig.yml'
              - 'scripts/retry-nix'
              - 'scripts/rust-cache-command'
            cargo-deny:
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/*/Cargo.toml'
              - 'deny.toml'
            package_dependencies:
              - '**/Cargo.toml'
              - 'Cargo.lock'
            aur_bin:
              - '.github/workflows/aur-build.yml'
              - '.github/workflows/aur.yml'
              - 'packaging/aur/rufin-bin/**'
              - 'packaging/aur/rufin-git/PKGBUILD'
            aur_git:
              - '.github/workflows/aur-build.yml'
              - '.github/workflows/aur.yml'
              - 'packaging/aur/rufin-git/**'
            rpm:
              - '.github/workflows/rpm-source.yml'
              - '.github/workflows/rpm.yml'
              - 'LICENSE'
              - 'README.md'
              - 'packaging/rpm/**'
            nix:
              - '.github/workflows/nix.yml'
              - 'LICENSE'
              - 'README.md'
              - 'flake.lock'
              - 'flake.nix'
              - 'scripts/retry-nix'
            flatpak:
              - '.github/workflows/flatpak-build.yml'
              - '.github/workflows/flatpak.yml'
              - 'LICENSE'
              - 'packaging/flatpak/**'
            macos:
              - '.cargo/**'
              - '.github/workflows/macos*.yml'
              - 'LICENSE'
              - 'packaging/macos/**'
            windows:
              - '.github/workflows/windows*.yml'
              - 'LICENSE'
              - 'packaging/windows/**'
              - 'scripts/rust-cache-command'
            container:
              - '.github/workflows/container-image.yml'
              - 'justfile'
              - 'packaging/aur/build'
              - 'packaging/container/**'
              - 'scripts/container'
            container_image:
              - 'packaging/container/**'
            current_nix:
              - 'flake.lock'
              - 'flake.nix'

      - name: Select build jobs
        id: select
        env:
          ALL_BUILDS: ${{ steps.paths.outputs.all_builds }}
          CONTAINER_IMAGE: ${{ steps.paths.outputs.container_image }}
          CURRENT_NIX: ${{ steps.paths.outputs.current_nix }}
          MATCHED_FILTERS: ${{ steps.paths.outputs.changes || '[]' }}
        run: |
          set -euo pipefail
          all_jobs='["aur_bin","aur_git","container","flatpak","macos","nix","rpm","windows"]'
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$ALL_BUILDS" == "true" ]]; then
            jobs="$all_jobs"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            jobs='["workspace"]'
          else
            jobs="$(
              jq -c '
                if index("package_dependencies") then
                  . + ["aur_bin", "flatpak", "macos", "nix", "rpm", "windows"]
                else
                  .
                end
                | map(select(
                    . != "all_builds" and
                    . != "container_image" and
                    . != "current_nix" and
                    . != "package_dependencies" and
                    . != "workflows"
                  ))
                | unique
                | if index("container") then
                    map(select(. != "cargo-deny" and . != "workspace"))
                  else
                    .
                  end
              ' <<< "$MATCHED_FILTERS"
            )"
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$CONTAINER_IMAGE" == "true" ]]; then
            build_container_image=true
          else
            build_container_image=false
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$CURRENT_NIX" == "true" ]]; then
            use_current_nix=true
          else
            use_current_nix=false
          fi
          {
            echo "build_container_image=$build_container_image"
            echo "jobs=$jobs"
            echo "use_current_nix=$use_current_nix"
          } >> "$GITHUB_OUTPUT"
          echo "Selected build jobs: $jobs"

      - name: Check workflows
        if: github.event_name == 'workflow_dispatch' || steps.paths.outputs.workflows == 'true'
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

  aur_bin:
    name: AUR rufin-bin
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'aur_bin')
    uses: ./.github/workflows/aur-build.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      package: rufin-bin
      publish: false

  aur_git:
    name: AUR rufin-git
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'aur_git')
    uses: ./.github/workflows/aur-build.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      package: rufin-git
      publish: false

  rpm:
    name: RPM
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'rpm')
    uses: ./.github/workflows/rpm-source.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      upload_artifact: false

  nix:
    name: Nix
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'nix')
    uses: ./.github/workflows/nix.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      upload_cache: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor == github.repository_owner }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  flatpak:
    name: Flatpak
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'flatpak')
    uses: ./.github/workflows/flatpak-build.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}

  macos:
    name: macOS
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'macos')
    uses: ./.github/workflows/macos-build.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}

  windows:
    name: Windows
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'windows')
    uses: ./.github/workflows/windows-build.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}

  container:
    name: Container
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'container')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Build container image
        if: needs.changes.outputs.build_container_image == 'true'
        run: |
          docker build \
            --file packaging/container/Containerfile \
            --tag localhost/rufin-dev:ci \
            packaging/container

      - name: Check Rufin through container
        env:
          RUFIN_CONTAINER_IMAGE: ${{ needs.changes.outputs.build_container_image == 'true' && 'localhost/rufin-dev:ci' || 'ghcr.io/screwys/rufin-dev:latest' }}
          RUFIN_CONTAINER_RUNTIME: docker
        run: |
          set -euo pipefail
          scripts/container setup
          scripts/container run just _check-container-image

  workspace:
    name: Workspace
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'workspace')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Select Nix environment
        id: nix-environment
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || '' }}
          USE_CURRENT_NIX: ${{ needs.changes.outputs.use_current_nix }}
        run: |
          set -euo pipefail
          if [[ "$USE_CURRENT_NIX" == "true" || -z "$BASE_REF" ]]; then
            echo "target=." >> "$GITHUB_OUTPUT"
          else
            echo "target=github:screwys/Rufin/$BASE_REF" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          extra_nix_config: |
            connect-timeout = 10
            download-attempts = 5
            extra-substituters = https://rufin.cachix.org
            extra-trusted-public-keys = rufin.cachix.org-1:7+XHqna/b9jZpCorYvZIoE0UjLju4IKbXlJGt35+SNc=
            max-substitution-jobs = 4
            stalled-download-timeout = 90

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-bin: "false"
          prefix-key: v1-rust
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cmd-format: bash scripts/rust-cache-command nix "${{ steps.nix-environment.outputs.target }}" {0}

      - name: Check Flatpak cargo sources
        if: github.event_name != 'push'
        run: bash scripts/retry-nix nix --accept-flake-config develop "${{ steps.nix-environment.outputs.target }}" --command cargo run --locked -p xtask -- generate flatpak-sources --check

      - name: Check Linux package dependencies
        if: github.event_name != 'push'
        run: bash scripts/retry-nix nix --accept-flake-config develop "${{ steps.nix-environment.outputs.target }}" --command cargo run --locked -p xtask -- generate linux-packaging --check

      - name: Check translation template
        if: github.event_name != 'push'
        run: bash scripts/retry-nix nix --accept-flake-config develop "${{ steps.nix-environment.outputs.target }}" --command cargo run --locked -p xtask -- generate i18n-template --check

      - name: Check Rust formatting
        if: github.event_name != 'push'
        run: bash scripts/retry-nix nix --accept-flake-config develop "${{ steps.nix-environment.outputs.target }}" --command cargo fmt --all -- --check

      - name: Check RefCell borrows
        if: github.event_name != 'push'
        run: >-
          bash scripts/retry-nix nix --accept-flake-config develop "${{ steps.nix-environment.outputs.target }}" --command
          just _ast-grep

      - name: Check Rust lints
        if: github.event_name != 'push'
        run: >-
          bash scripts/retry-nix nix --accept-flake-config develop "${{ steps.nix-environment.outputs.target }}" --command
          just _lint

      - name: Run Rust tests
        if: github.event_name != 'push'
        run: |
          bash scripts/retry-nix nix --accept-flake-config develop "${{ steps.nix-environment.outputs.target }}" --command \
            bash -c 'nextest_jobs="${NEXTEST_JOBS:-4}"; if [[ ! "$nextest_jobs" =~ ^[1-9][0-9]*$ ]]; then echo "NEXTEST_JOBS must be a positive integer." >&2; exit 1; fi; if command -v cargo-nextest >/dev/null 2>&1; then cargo nextest run --workspace --locked --test-threads "$nextest_jobs"; else echo "cargo-nextest is unavailable; falling back to cargo test." >&2; cargo test --workspace --locked --lib --bins --tests --benches --examples; fi'

      - name: Warm Rust build cache
        if: github.event_name == 'push'
        run: |
          bash scripts/retry-nix nix --accept-flake-config develop "${{ steps.nix-environment.outputs.target }}" --command \
            cargo check --workspace --all-targets --locked
          bash scripts/retry-nix nix --accept-flake-config develop "${{ steps.nix-environment.outputs.target }}" --command \
            cargo test --workspace --locked --no-run --lib --bins --tests --benches --examples

  cargo-deny:
    name: cargo-deny
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'cargo-deny')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check Rust dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --locked
          command: check
          command-arguments: -D unmatched-skip

  required:
    name: Required
    needs:
      - changes
      - aur_bin
      - aur_git
      - rpm
      - nix
      - flatpak
      - macos
      - windows
      - container
      - workspace
      - cargo-deny
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Enforce selected jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RESULTS: ${{ toJSON(needs) }}
          SELECTED_JOBS: ${{ needs.changes.outputs.jobs || '[]' }}
        run: |
          set -euo pipefail
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change classification failed: $CHANGES_RESULT" >&2
            exit 1
          fi
          while IFS= read -r job; do
            result="$(jq -r --arg job "$job" '.[$job].result // "missing"' <<< "$RESULTS")"
            if [[ "$result" != "success" ]]; then
              echo "$job did not pass: $result" >&2
              exit 1
            fi
          done < <(jq -r '.[]' <<< "$SELECTED_JOBS")
