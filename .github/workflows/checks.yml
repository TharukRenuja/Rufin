name: Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CACHIX_CACHE_NAME: rufin

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      aur_release_tag: ${{ steps.classify.outputs.aur_release_tag }}
      aur_required: ${{ steps.classify.outputs.aur_required }}
      container_required: ${{ steps.classify.outputs.container_required }}
      current_nix_required: ${{ steps.classify.outputs.current_nix_required }}
      dependency_policy_required: ${{ steps.classify.outputs.dependency_policy_required }}
      nix_package_required: ${{ steps.classify.outputs.nix_package_required }}
      package_dependencies_required: ${{ steps.classify.outputs.package_dependencies_required }}
      rpm_required: ${{ steps.classify.outputs.rpm_required }}
      rust_cache_required: ${{ steps.classify.outputs.rust_cache_required }}
      rust_required: ${{ steps.classify.outputs.rust_required }}
      workflows_required: ${{ steps.classify.outputs.workflows_required }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            {
              echo "aur_release_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*')"
              echo "aur_required=true"
              echo "container_required=true"
              echo "current_nix_required=true"
              echo "dependency_policy_required=true"
              echo "nix_package_required=true"
              echo "package_dependencies_required=true"
              echo "rpm_required=true"
              echo "rust_cache_required=true"
              echo "rust_required=true"
              echo "workflows_required=true"
            } >> "$GITHUB_OUTPUT"
            echo "Manual runs execute the container and full Rust checks."
            exit 0
          fi

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="$BASE_SHA"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            git fetch --no-tags --prune origin \
              "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}" || true
            base="$(git merge-base "$HEAD_SHA" "origin/$DEFAULT_BRANCH" 2>/dev/null ||
              git rev-list --max-parents=0 "$HEAD_SHA")"
          else
            base="$BEFORE_SHA"
          fi

          mapfile -t changed_paths < <(git diff --name-only "$base" "$HEAD_SHA")

          rust_required=false
          rust_cache_required=false
          aur_required=false
          rpm_required=false
          container_required=false
          current_nix_required=false
          dependency_policy_required=false
          nix_package_required=false
          package_dependencies_required=false
          workflows_required=false
          if [[ "${#changed_paths[@]}" -eq 0 ]]; then
            aur_required=true
            container_required=true
            dependency_policy_required=true
            rpm_required=true
            rust_required=true
            current_nix_required=true
            nix_package_required=true
            package_dependencies_required=true
          fi

          for path in "${changed_paths[@]}"; do
            case "$path" in
              .github/workflows/*.yml|.github/workflows/*.yaml)
                workflows_required=true
                ;;
            esac

            case "$path" in
              .github/workflows/checks.yml)
                aur_required=true
                container_required=true
                dependency_policy_required=true
                nix_package_required=true
                package_dependencies_required=true
                rpm_required=true
                rust_required=true
                ;;
            esac

            case "$path" in
              .github/workflows/container-image.yml|justfile|scripts/container|packaging/container/*)
                container_required=true
                ;;
            esac

            case "$path" in
              .github/workflows/aur-build.yml|.github/workflows/aur.yml|packaging/aur/rufin-bin/PKGBUILD.template|packaging/aur/rufin-git/PKGBUILD|packaging/aur/rufin-git/.SRCINFO|scripts/check-deps)
                aur_required=true
                ;;
            esac

            case "$path" in
              .github/workflows/rpm-source.yml|.github/workflows/rpm.yml|crates/xtask/src/rpm.rs|packaging/rpm/*|scripts/build-rpm)
                rpm_required=true
                ;;
            esac

            case "$path" in
              flake.lock|flake.nix)
                current_nix_required=true
                ;;
            esac

            case "$path" in
              .github/workflows/nix.yml|Cargo.lock|Cargo.toml|crates/*/Cargo.toml|flake.lock|flake.nix|scripts/check-deps|scripts/retry-nix)
                nix_package_required=true
                ;;
            esac

            case "$path" in
              Cargo.lock|Cargo.toml|crates/*/Cargo.toml|deny.toml)
                dependency_policy_required=true
                ;;
            esac

            case "$path" in
              crates/*/Cargo.toml|flake.nix|justfile|scripts/check-deps|packaging/aur/rufin-bin/PKGBUILD.template|packaging/aur/rufin-git/PKGBUILD)
                package_dependencies_required=true
                ;;
            esac

            case "$path" in
              Cargo.lock|Cargo.toml|crates/*/Cargo.toml|flake.lock|flake.nix|scripts/rust-cache-command)
                rust_cache_required=true
                ;;
            esac

            case "$path" in
              .github/workflows/aur-build.yml|.github/workflows/aur.yml|.github/workflows/checks.yml|.github/workflows/container-image.yml|.github/workflows/nix.yml|.github/workflows/rpm-source.yml|.github/workflows/rpm.yml|deny.toml|packaging/aur/*|packaging/container/*|packaging/rpm/*|scripts/build-rpm|scripts/check-deps|scripts/container|scripts/retry-nix)
                ;;
              *.avif|*.gif|*.jpeg|*.jpg|*.md|*.png|*.po|*.pot|*.svg|*.webp)
                ;;
              *)
                rust_required=true
                ;;
            esac
          done

          printf 'Changed paths:\n'
          printf '  %s\n' "${changed_paths[@]}"
          aur_release_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*')"
          {
            echo "aur_release_tag=$aur_release_tag"
            echo "aur_required=$aur_required"
            echo "container_required=$container_required"
            echo "current_nix_required=$current_nix_required"
            echo "dependency_policy_required=$dependency_policy_required"
            echo "nix_package_required=$nix_package_required"
            echo "package_dependencies_required=$package_dependencies_required"
            echo "rpm_required=$rpm_required"
            echo "rust_cache_required=$rust_cache_required"
            echo "rust_required=$rust_required"
            echo "workflows_required=$workflows_required"
          } >> "$GITHUB_OUTPUT"

      - name: Check Linux package dependencies
        if: steps.classify.outputs.package_dependencies_required == 'true'
        run: bash scripts/check-deps --check

      - name: Check workflows
        if: steps.classify.outputs.workflows_required == 'true'
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

  aur-package:
    name: AUR package
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.aur_required == 'true'
    uses: ./.github/workflows/aur-build.yml
    with:
      package: both
      release_tag: ${{ needs.changes.outputs.aur_release_tag }}
      publish: false

  rpm-package:
    name: RPM source package
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.rpm_required == 'true'
    uses: ./.github/workflows/rpm-source.yml
    with:
      ref: ${{ github.sha }}

  nix-package:
    name: Nix package
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.nix_package_required == 'true'
    uses: ./.github/workflows/nix.yml
    with:
      ref: ${{ github.sha }}
      upload_cache: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor == github.repository_owner }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  container:
    name: Container
    needs: changes
    if: needs.changes.outputs.container_required == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build container image
        run: |
          docker build \
            --file packaging/container/Containerfile \
            --tag localhost/rufin-dev:ci \
            packaging/container

      - name: Check Rufin through container
        env:
          RUFIN_CONTAINER_IMAGE: localhost/rufin-dev:ci
          RUFIN_CONTAINER_RUNTIME: docker
        run: |
          scripts/container setup
          scripts/container run just check

  workspace:
    name: Workspace
    needs: changes
    if: >-
      (github.event_name == 'push' && needs.changes.outputs.rust_cache_required == 'true') ||
      (github.event_name != 'push' && needs.changes.outputs.rust_required == 'true' && needs.changes.outputs.container_required != 'true')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Select Nix environment
        id: nix-environment
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CURRENT_NIX_REQUIRED: ${{ needs.changes.outputs.current_nix_required }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$CURRENT_NIX_REQUIRED" != "true" ]]; then
            echo "target=github:screwys/Rufin/$BASE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "target=." >> "$GITHUB_OUTPUT"
          fi

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          extra_nix_config: |
            connect-timeout = 10
            download-attempts = 5
            extra-substituters = https://rufin.cachix.org
            extra-trusted-public-keys = rufin.cachix.org-1:7+XHqna/b9jZpCorYvZIoE0UjLju4IKbXlJGt35+SNc=
            max-substitution-jobs = 4
            stalled-download-timeout = 90

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-bin: "false"
          prefix-key: v1-rust
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cmd-format: bash scripts/rust-cache-command "${{ steps.nix-environment.outputs.target }}" {0}

      - name: Check Flatpak cargo sources
        if: github.event_name != 'push'
        run: bash scripts/retry-nix nix --accept-flake-config develop "${{ steps.nix-environment.outputs.target }}" --command cargo run --locked -p xtask -- generate flatpak-sources --check

      - name: Check translation template
        if: github.event_name != 'push'
        run: bash scripts/retry-nix nix --accept-flake-config develop "${{ steps.nix-environment.outputs.target }}" --command cargo run --locked -p xtask -- generate i18n-template --check

      - name: Check Rust formatting
        if: github.event_name != 'push'
        run: bash scripts/retry-nix nix --accept-flake-config develop "${{ steps.nix-environment.outputs.target }}" --command cargo fmt --all -- --check

      - name: Check RefCell borrows
        if: github.event_name != 'push'
        run: >-
          bash scripts/retry-nix nix --accept-flake-config develop "${{ steps.nix-environment.outputs.target }}" --command
          just _ast-grep

      - name: Check Rust lints
        if: github.event_name != 'push'
        run: >-
          bash scripts/retry-nix nix --accept-flake-config develop "${{ steps.nix-environment.outputs.target }}" --command
          just _lint

      - name: Run Rust tests
        if: github.event_name != 'push'
        run: |
          bash scripts/retry-nix nix --accept-flake-config develop "${{ steps.nix-environment.outputs.target }}" --command \
            cargo run --locked -p xtask -- verify icons
          bash scripts/retry-nix nix --accept-flake-config develop "${{ steps.nix-environment.outputs.target }}" --command \
            bash -c 'nextest_jobs="${NEXTEST_JOBS:-4}"; if [[ ! "$nextest_jobs" =~ ^[1-9][0-9]*$ ]]; then echo "NEXTEST_JOBS must be a positive integer." >&2; exit 1; fi; if command -v cargo-nextest >/dev/null 2>&1; then cargo nextest run --workspace --locked --test-threads "$nextest_jobs"; else echo "cargo-nextest is unavailable; falling back to cargo test." >&2; cargo test --workspace --locked --lib --bins --tests --benches --examples; fi'

      - name: Warm Rust test cache
        if: github.event_name == 'push'
        run: |
          bash scripts/retry-nix nix --accept-flake-config develop "${{ steps.nix-environment.outputs.target }}" --command \
            cargo test --workspace --locked --no-run --lib --bins --tests --benches --examples

  cargo-deny:
    name: cargo-deny
    needs: changes
    if: >-
      github.event_name != 'push' &&
      needs.changes.outputs.dependency_policy_required == 'true' &&
      needs.changes.outputs.container_required != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check Rust dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --locked
          command: check
          command-arguments: -D unmatched-skip

  required:
    name: Required
    needs:
      - changes
      - aur-package
      - rpm-package
      - nix-package
      - container
      - workspace
      - cargo-deny
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Enforce check policy
        env:
          AUR_REQUIRED: ${{ needs.changes.outputs.aur_required }}
          AUR_RESULT: ${{ needs.aur-package.result }}
          CARGO_DENY_RESULT: ${{ needs.cargo-deny.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          CONTAINER_REQUIRED: ${{ needs.changes.outputs.container_required }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          DEPENDENCY_POLICY_REQUIRED: ${{ needs.changes.outputs.dependency_policy_required }}
          EVENT_NAME: ${{ github.event_name }}
          NIX_PACKAGE_REQUIRED: ${{ needs.changes.outputs.nix_package_required }}
          NIX_PACKAGE_RESULT: ${{ needs.nix-package.result }}
          RPM_REQUIRED: ${{ needs.changes.outputs.rpm_required }}
          RPM_RESULT: ${{ needs.rpm-package.result }}
          RUST_CACHE_REQUIRED: ${{ needs.changes.outputs.rust_cache_required }}
          RUST_REQUIRED: ${{ needs.changes.outputs.rust_required }}
          WORKSPACE_RESULT: ${{ needs.workspace.result }}
        run: |
          set -euo pipefail

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change classification failed: $CHANGES_RESULT" >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$RUST_CACHE_REQUIRED" != "true" ]]; then
              echo "Rust cache update is not required."
              exit 0
            fi
            if [[ "$WORKSPACE_RESULT" != "success" ]]; then
              echo "Rust cache update did not pass: $WORKSPACE_RESULT" >&2
              exit 1
            fi
            echo "Rust cache updated."
            exit 0
          fi

          if [[ "$NIX_PACKAGE_REQUIRED" == "true" && "$NIX_PACKAGE_RESULT" != "success" ]]; then
            echo "Nix package check did not pass: $NIX_PACKAGE_RESULT" >&2
            exit 1
          fi

          if [[ "$AUR_REQUIRED" == "true" && "$AUR_RESULT" != "success" ]]; then
            echo "AUR package check did not pass: $AUR_RESULT" >&2
            exit 1
          fi

          if [[ "$RPM_REQUIRED" == "true" && "$RPM_RESULT" != "success" ]]; then
            echo "RPM source package check did not pass: $RPM_RESULT" >&2
            exit 1
          fi

          if [[ "$CONTAINER_REQUIRED" == "true" && "$CONTAINER_RESULT" != "success" ]]; then
            echo "Container build did not pass: $CONTAINER_RESULT" >&2
            exit 1
          fi

          if [[ "$DEPENDENCY_POLICY_REQUIRED" == "true" && "$CONTAINER_REQUIRED" != "true" && "$CARGO_DENY_RESULT" != "success" ]]; then
            echo "cargo-deny check did not pass: $CARGO_DENY_RESULT" >&2
            exit 1
          fi

          if [[ "$RUST_REQUIRED" != "true" ]]; then
            echo "Full Rust checks are not required."
            exit 0
          fi

          if [[ "$CONTAINER_REQUIRED" == "true" ]]; then
            echo "Required Rust checks passed through the container."
            exit 0
          fi

          if [[ "$WORKSPACE_RESULT" != "success" ]]; then
            echo "Workspace check did not pass: $WORKSPACE_RESULT" >&2
            exit 1
          fi

          echo "Required Rust checks passed."
