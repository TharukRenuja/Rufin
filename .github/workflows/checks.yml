name: Checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      rust_required: ${{ steps.classify.outputs.rust_required }}

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "rust_required=true" >> "$GITHUB_OUTPUT"
            echo "Manual runs execute the full Rust checks."
            exit 0
          fi

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="$BASE_SHA"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            git fetch --no-tags --prune origin \
              "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}" || true
            base="$(git merge-base "$HEAD_SHA" "origin/$DEFAULT_BRANCH" 2>/dev/null ||
              git rev-list --max-parents=0 "$HEAD_SHA")"
          else
            base="$BEFORE_SHA"
          fi

          mapfile -t changed_paths < <(git diff --name-only "$base" "$HEAD_SHA")

          rust_required=false
          if [[ "${#changed_paths[@]}" -eq 0 ]]; then
            rust_required=true
          fi

          for path in "${changed_paths[@]}"; do
            case "$path" in
              *.avif|*.gif|*.jpeg|*.jpg|*.md|*.png|*.po|*.pot|*.svg|*.webp|po/POTFILES.in)
                ;;
              *)
                rust_required=true
                ;;
            esac
          done

          printf 'Changed paths:\n'
          printf '  %s\n' "${changed_paths[@]}"
          echo "rust_required=$rust_required" >> "$GITHUB_OUTPUT"

  workspace:
    name: Workspace
    needs: changes
    if: needs.changes.outputs.rust_required == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Select Nix environment
        id: nix-environment
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "target=github:screwys/Rufin/$BASE_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "target=." >> "$GITHUB_OUTPUT"
          fi

      - name: Check Flatpak cargo sources
        run: bash packaging/flatpak/update-cargo-sources.sh --check

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31
        with:
          extra_nix_config: |
            connect-timeout = 10
            download-attempts = 5
            extra-substituters = https://screwys-rufin.cachix.org
            extra-trusted-public-keys = screwys-rufin.cachix.org-1:BOMRVJbl30p0hFwsumnUXNjf88hLOysCSAhNpLhljqA=
            max-substitution-jobs = 4
            stalled-download-timeout = 90

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-bin: "false"
          prefix-key: v1-rust
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cmd-format: bash .github/scripts/retry-nix-command.sh nix --accept-flake-config develop "${{ steps.nix-environment.outputs.target }}" --command {0}

      - name: Check Rust formatting
        run: bash .github/scripts/retry-nix-command.sh nix --accept-flake-config develop "${{ steps.nix-environment.outputs.target }}" --command cargo fmt --all -- --check

      - name: Check Rust lints
        run: bash .github/scripts/retry-nix-command.sh nix --accept-flake-config develop "${{ steps.nix-environment.outputs.target }}" --command cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Rust tests
        run: bash .github/scripts/retry-nix-command.sh nix --accept-flake-config develop "${{ steps.nix-environment.outputs.target }}" --command bash scripts/test-rust.sh --full

  cargo-deny:
    name: cargo-deny
    needs: changes
    if: needs.changes.outputs.rust_required == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Check Rust dependency policy
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          arguments: --locked
          command: check

  required:
    name: Required
    needs:
      - changes
      - workspace
      - cargo-deny
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Enforce check policy
        env:
          CARGO_DENY_RESULT: ${{ needs.cargo-deny.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUST_REQUIRED: ${{ needs.changes.outputs.rust_required }}
          WORKSPACE_RESULT: ${{ needs.workspace.result }}
        run: |
          set -euo pipefail

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change classification failed: $CHANGES_RESULT" >&2
            exit 1
          fi

          if [[ "$RUST_REQUIRED" != "true" ]]; then
            echo "Docs-only change; Rust checks are not required."
            exit 0
          fi

          if [[ "$WORKSPACE_RESULT" != "success" ]]; then
            echo "Workspace check did not pass: $WORKSPACE_RESULT" >&2
            exit 1
          fi

          if [[ "$CARGO_DENY_RESULT" != "success" ]]; then
            echo "cargo-deny check did not pass: $CARGO_DENY_RESULT" >&2
            exit 1
          fi

          echo "Required Rust checks passed."
