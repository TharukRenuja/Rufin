[package]
name = "rufin-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "rufin"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
gettext-rs = { version = "0.7.7", features = ["gettext-system"] }
gtk = { package = "gtk4", version = "0.11.3", features = ["v4_22"] }
adw = { package = "libadwaita", version = "0.9.1", features = ["v1_9", "gtk_v4_22"] }
rufin-core = { path = "../rufin-core" }
rufin-test-support = { path = "../rufin-test-support" }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[lints]
workspace = true
