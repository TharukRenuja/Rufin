[package]
name = "rufin-app"
version = "0.1.4"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "rufin"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
directories = "6.0.0"
gettext-rs = { version = "0.7.7", features = ["gettext-system"] }
gdk-pixbuf = "0.22.0"
gtk = { package = "gtk4", version = "0.11.3", features = ["v4_20"] }
adw = { package = "libadwaita", version = "0.9.1", features = ["v1_8", "gtk_v4_20"] }
md5 = "0.8.0"
mpris-server = "0.10.0"
reqwest = { version = "0.13.3", features = ["blocking", "form", "json"] }
rufin-core = { path = "../rufin-core" }
rufin-playback = { path = "../rufin-playback" }
rufin-provider = { path = "../rufin-provider" }
rufin-provider-jellyfin = { path = "../rufin-provider-jellyfin" }
rufin-provider-local = { path = "../rufin-provider-local" }
rufin-provider-subsonic = { path = "../rufin-provider-subsonic" }
rufin-secrets = { path = "../rufin-secrets" }
rufin-store = { path = "../rufin-store" }
rufin-test-support = { path = "../rufin-test-support" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[lints]
workspace = true
