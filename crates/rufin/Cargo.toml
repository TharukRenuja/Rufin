[package]
name = "rufin"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true
keywords = ["music", "audio", "gtk4", "jellyfin", "subsonic"]
categories = ["multimedia::audio", "gui"]
build = "build.rs"

[[bin]]
name = "rufin"
path = "src/main.rs"

[dependencies]
async-channel.workspace = true
async-trait.workspace = true
artwork.workspace = true
clap = { workspace = true, features = ["derive"] }
directories.workspace = true
getrandom.workspace = true
glib.workspace = true
md5.workspace = true
reqwest = { workspace = true, features = ["blocking", "form", "json"] }
playback.workspace = true
playback-gstreamer.workspace = true
rich-presence.workspace = true
scrobbling.workspace = true
sources.workspace = true
secrets.workspace = true
library.workspace = true
library-sync.workspace = true
localization.workspace = true
metadata.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
ui.workspace = true

[dev-dependencies]
rusqlite.workspace = true

[lints]
workspace = true
