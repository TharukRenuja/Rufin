[package]
name = "rufin"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
publish.workspace = true
keywords = ["music", "audio", "gtk4", "jellyfin", "subsonic"]
categories = ["multimedia::audio", "gui"]
build = "build.rs"

[[bin]]
name = "rufin"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
clap = { workspace = true, features = ["derive"] }
directories.workspace = true
gdk-pixbuf.workspace = true
getrandom.workspace = true
gtk = { workspace = true, features = ["v4_20"] }
adw = { workspace = true, features = ["v1_8", "gtk_v4_20"] }
md5.workspace = true
notify.workspace = true
reqwest = { workspace = true, features = ["blocking", "form", "json"] }
domain.workspace = true
playback.workspace = true
source.workspace = true
source-jellyfin.workspace = true
source-local.workspace = true
source-subsonic.workspace = true
secrets.workspace = true
library.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[dev-dependencies]
rusqlite.workspace = true

[target.'cfg(unix)'.dependencies]
ksni = { workspace = true, features = ["blocking"] }
mpris-server.workspace = true

[lints]
workspace = true
