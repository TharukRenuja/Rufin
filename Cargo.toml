[workspace]
members = [
    "crates/rufin-app",
    "crates/rufin-core",
    "crates/rufin-playback",
    "crates/rufin-provider",
    "crates/rufin-provider-jellyfin",
    "crates/rufin-provider-subsonic",
    "crates/rufin-secrets",
    "crates/rufin-store",
    "crates/rufin-test-support",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.92"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
