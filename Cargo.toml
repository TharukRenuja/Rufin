[workspace]
members = [
    "crates/artwork",
    "crates/rufin",
    "crates/domain",
    "crates/playback",
    "crates/playback-gstreamer",
    "crates/rich-presence",
    "crates/scrobbling",
    "crates/metadata",
    "crates/sources",
    "crates/secrets",
    "crates/library",
    "crates/library-sync",
    "crates/xtask",
]
resolver = "2"

[workspace.package]
version = "0.8.0"
authors = ["screwy <screwygit@proton.me>"]
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.95"
description = "Native GTK4/libadwaita music client for Jellyfin, Subsonic, Navidrome and local libraries written in Rust"
repository = "https://github.com/screwys/Rufin"
readme = "README.md"
publish = false

[workspace.dependencies]
adw = { package = "libadwaita", version = "0.9.1" }
async-trait = "0.1.89"
artwork = { path = "crates/artwork" }
base64 = "0.22.1"
clap = "4.6.1"
directories = "6.0.0"
domain = { path = "crates/domain" }
futures-executor = "0.3.32"
futures-util = "0.3.32"
gdk-pixbuf = "0.22.0"
getrandom = "0.4.0"
gstreamer = "0.25.2"
gstreamer-audio = "0.25.2"
gtk = { package = "gtk4", version = "0.11.3" }
ksni = "0.3.4"
library = { path = "crates/library" }
library-sync = { path = "crates/library-sync" }
metadata = { path = "crates/metadata" }
lofty = "0.24.0"
md5 = "0.8.0"
mpris-server = "0.10.0"
notify = "8.2.0"
oo7 = "0.6.0"
percent-encoding = "2.3.2"
playback = { path = "crates/playback" }
playback-gstreamer = { path = "crates/playback-gstreamer" }
rich-presence = { path = "crates/rich-presence" }
scrobbling = { path = "crates/scrobbling" }
reqwest = "0.13.3"
rusqlite = "0.40.1"
rustfft = "6.2.0"
secrets = { path = "crates/secrets" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sources = { path = "crates/sources" }
tempfile = "3.23.0"
thiserror = "2.0.18"
tokio = "1.52.3"
tokio-tungstenite = { version = "0.29.0", default-features = false }
tracing = "0.1.41"
tracing-subscriber = "0.3.23"
url = "2.5.7"
walkdir = "2.5.0"
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"
dead_code = "deny"
warnings = "deny"

[workspace.lints.clippy]
all = { level = "allow", priority = -2 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
large_include_file = "deny"
exit = "deny"
fallible_impl_from = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"
map_entry = "deny"
format_in_format_args = "deny"
to_string_in_format_args = "deny"
manual_memcpy = "deny"
manual_ignore_case_cmp = "deny"
manual_retain = "deny"
collapsible_str_replace = "deny"
double_ended_iterator_last = "deny"
drain_collect = "deny"
extend_with_drain = "deny"
iter_overeager_cloned = "deny"
manual_contains = "deny"
manual_str_repeat = "deny"
readonly_write_lock = "deny"
redundant_iter_cloned = "deny"
sliced_string_as_bytes = "deny"
unbuffered_bytes = "deny"
unnecessary_to_owned = "deny"
waker_clone_wake = "deny"
cmp_owned = "deny"
regex_creation_in_loops = "deny"
slow_vector_initialization = "deny"
useless_vec = "deny"
vec_init_then_push = "deny"

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false
