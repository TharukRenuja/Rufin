[workspace]
members = [
    "crates/rufin",
    "crates/domain",
    "crates/playback",
    "crates/source",
    "crates/source-jellyfin",
    "crates/source-local",
    "crates/source-subsonic",
    "crates/secrets",
    "crates/library",
    "crates/test-support",
]
resolver = "2"

[workspace.package]
version = "0.7.1"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false
